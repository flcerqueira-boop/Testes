<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fisio+ by OrtoFlix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a1628;
      --bg2: #0d1f35;
      --surface: rgba(255,255,255,0.06);
      --surface2: rgba(255,255,255,0.10);
      --border: rgba(255,255,255,0.10);
      --accent: #f97316;
      --accent-soft: rgba(249,115,22,0.15);
      --text: #e6edf3;
      --text-muted: rgba(255,255,255,0.50);
      --text-subtle: rgba(255,255,255,0.25);
      --red: #E8192C;
      --red-soft: rgba(232,25,44,0.12);
      --radius-lg: 20px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    /* HEADER */
    header {
      padding: 32px 24px 28px;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
    }
    .header-inner { display: flex; align-items: center; gap: 20px; }
    .header-icon { width: 64px; height: 64px; border-radius: 16px; flex-shrink: 0; }
    .header-logo { height: 52px; width: auto; }

    /* MAIN */
    main { flex: 1; max-width: 480px; margin: 0 auto; padding: 8px 20px 60px; width: 100%; }

    .modules-label {
      font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700;
      color: var(--text-subtle); text-transform: uppercase; letter-spacing: 1.5px;
      margin-bottom: 14px; margin-top: 8px;
    }

    .module-card {
      display: flex; align-items: center; gap: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 18px; margin-bottom: 10px;
      text-decoration: none; color: var(--text);
      transition: all 0.2s; position: relative; overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .module-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: 0; transition: opacity 0.2s; }
    .module-card:hover { border-color: var(--accent); background: var(--surface2); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    .module-card:hover::before { opacity: 1; }

    .module-icon { width: 50px; height: 50px; border-radius: 14px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .module-icon.blue { background: rgba(88,166,255,0.15); }
    .module-icon.green { background: rgba(63,185,80,0.15); }

    .module-info { flex: 1; }
    .module-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; margin-bottom: 3px; line-height: 1.3; }
    .module-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
    .module-arrow { color: var(--text-subtle); font-size: 18px; flex-shrink: 0; transition: transform 0.2s, color 0.2s; }
    .module-card:hover .module-arrow { transform: translateX(4px); color: var(--accent); }

    .module-tag { display: inline-block; background: rgba(63,185,80,0.15); color: #3fb950; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; font-family: 'Syne', sans-serif; letter-spacing: 0.5px; margin-top: 5px; }
    .module-tag.ext { background: rgba(88,166,255,0.15); color: #58a6ff; }

    /* ORTOFLIX */
    .ortoflix-card {
      display: flex; align-items: center; gap: 18px;
      background: var(--surface);
      border: 1px solid var(--red);
      border-radius: var(--radius-lg);
      padding: 20px 18px; margin-top: 10px;
      text-decoration: none; color: var(--text);
      transition: all 0.2s; position: relative; overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .ortoflix-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--red); opacity: 0; transition: opacity 0.2s; }
    .ortoflix-card:hover { background: var(--surface2); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(232,25,44,0.15); }
    .ortoflix-card:hover::before { opacity: 1; }
    .ortoflix-card:hover .module-arrow { transform: translateX(4px); color: var(--red); }
    .ortoflix-icon { width: 50px; height: 50px; border-radius: 14px; background: var(--red-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ortoflix-logo-img { width: 34px; height: auto; }

    /* FOOTER */
    footer { text-align: center; padding: 32px 20px; border-top: 1px solid var(--border); }
    .footer-dev { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; }
    .footer-links { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .footer-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 12px; padding: 7px 14px; border: 1px solid var(--border); border-radius: 20px; transition: all 0.2s; }
    .footer-link:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
