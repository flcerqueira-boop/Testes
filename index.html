<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

/* =========================================================================
   FIREBASE — cadastro/login (liberação automática, sem confirmação por
   e-mail) e coleta de leads (nome, e-mail, perfil aluno/professor).
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyC29uyLP3YS-VMs8aFEwYe4qbgblGGP8eY",
  authDomain: "fisiolab-a4835.firebaseapp.com",
  projectId: "fisiolab-a4835",
  storageBucket: "fisiolab-a4835.firebasestorage.app",
  messagingSenderId: "395561821532",
  appId: "1:395561821532:web:6a33520680d6f2df830d99",
  measurementId: "G-VZLR1G737C",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function CadastroLogin() {
  const [modo, setModo] = useState("login"); // "cadastro" | "login"
  const [nome, setNome] = useState("");
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [perfil, setPerfil] = useState("aluno"); // "aluno" | "professor"
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  function traduzErro(e) {
    const code = e && e.code;
    const mapa = {
      "auth/email-already-in-use": "Esse e-mail já tem cadastro. Tente fazer login.",
      "auth/invalid-email": "E-mail inválido.",
      "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
      "auth/wrong-password": "Senha incorreta.",
      "auth/user-not-found": "Não encontramos cadastro com esse e-mail.",
      "auth/invalid-credential": "E-mail ou senha incorretos.",
      "auth/unauthorized-domain": "Este domínio ainda não está autorizado no Firebase (Authentication → Settings → Authorized domains).",
      "auth/operation-not-allowed": "Login por e-mail/senha não está habilitado no Firebase (Authentication → Sign-in method).",
      "permission-denied": "Sem permissão para salvar no banco de dados (verifique as regras do Firestore).",
    };
    if (mapa[code]) return mapa[code];
    return "Não foi possível concluir (" + (code || (e && e.message) || "erro desconhecido") + "). Tente novamente.";
  }

  async function handleCadastro() {
    setError("");
    if (!nome.trim() || !email.trim() || !senha) {
      setError("Preencha nome, e-mail e senha.");
      return;
    }
    setLoading(true);
    try {
      const cred = await auth.createUserWithEmailAndPassword(email.trim(), senha);
      await cred.user.updateProfile({ displayName: nome.trim() });
      await db.collection("usuarios").doc(cred.user.uid).set({
        nome: nome.trim(),
        email: email.trim(),
        perfil,
        criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
      });
      // já autenticado automaticamente — sem etapa de confirmação por e-mail
    } catch (e) {
      setError(traduzErro(e));
    } finally {
      setLoading(false);
    }
  }

  async function handleLogin() {
    setError("");
    if (!email.trim() || !senha) {
      setError("Preencha e-mail e senha.");
      return;
    }
    setLoading(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), senha);
    } catch (e) {
      setError(traduzErro(e));
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="min-h-screen w-full flex flex-col items-center justify-center p-5" style={{ background: "#F5F5F7" }}>
      <div className="max-w-sm w-full rounded-2xl p-6" style={{ background: "#FFFFFF", border: "1px solid #E5E5EA" }}>
        <div className="flex items-center justify-center gap-3 mb-2">
          <CubeIcon size={48} />
          <div className="text-left">
            <h1 className="text-3xl leading-none" style={{ color: "#1D1D1F", fontFamily: "'Poppins', sans-serif", fontWeight: 800 }}>
              Fisio<span style={{ color: "#22C55E" }}>Lab</span>
            </h1>
            <p className="text-xs mt-1" style={{ color: "#6E6E73" }}>
              by OrtoFlix — Ambiente de Estudo
            </p>
          </div>
        </div>
        <p className="text-xs text-center mb-4" style={{ color: "#9A9AA0" }}>
          Ambiente gratuito de estudo com simuladores, jogos e casos clínicos para alunos e professores de fisioterapia.
        </p>
        <p className="text-sm text-center mb-5" style={{ color: "#6E6E73" }}>
          {modo === "cadastro" ? "Crie sua conta para começar" : "Entre na sua conta"}
        </p>

        {modo === "cadastro" && (
          <div className="mb-3">
            <label className="text-xs font-medium block mb-1" style={{ color: "#6E6E73" }}>Nome</label>
            <input
              value={nome}
              onChange={(e) => setNome(e.target.value)}
              className="w-full rounded-lg px-3 py-2 text-sm border outline-none"
              style={{ borderColor: "#E5E5EA" }}
            />
          </div>
        )}

        <div className="mb-3">
          <label className="text-xs font-medium block mb-1" style={{ color: "#6E6E73" }}>E-mail</label>
          <input
            type="email"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            className="w-full rounded-lg px-3 py-2 text-sm border outline-none"
            style={{ borderColor: "#E5E5EA" }}
          />
        </div>

        <div className="mb-3">
          <label className="text-xs font-medium block mb-1" style={{ color: "#6E6E73" }}>Senha</label>
          <input
            type="password"
            value={senha}
            onChange={(e) => setSenha(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && (modo === "cadastro" ? handleCadastro() : handleLogin())}
            className="w-full rounded-lg px-3 py-2 text-sm border outline-none"
            style={{ borderColor: "#E5E5EA" }}
          />
        </div>

        {modo === "cadastro" && (
          <div className="mb-4">
            <label className="text-xs font-medium block mb-1" style={{ color: "#6E6E73" }}>Você é...</label>
            <div className="flex gap-2">
              <button
                onClick={() => setPerfil("aluno")}
                className="flex-1 py-2 rounded-lg text-sm font-medium"
                style={perfil === "aluno" ? { background: "#22C55E", color: "#FFFFFF" } : { background: "#F5F5F7", color: "#6E6E73", border: "1px solid #E5E5EA" }}
              >
                Estudante
              </button>
              <button
                onClick={() => setPerfil("professor")}
                className="flex-1 py-2 rounded-lg text-sm font-medium"
                style={perfil === "professor" ? { background: "#22C55E", color: "#FFFFFF" } : { background: "#F5F5F7", color: "#6E6E73", border: "1px solid #E5E5EA" }}
              >
                Professor
              </button>
            </div>
          </div>
        )}

        {error && <p className="text-xs mb-3" style={{ color: "#EF4444" }}>{error}</p>}

        <button
          onClick={modo === "cadastro" ? handleCadastro : handleLogin}
          disabled={loading}
          className="w-full py-2.5 rounded-full text-sm font-semibold disabled:opacity-50"
          style={{ background: "#22C55E", color: "#FFFFFF" }}
        >
          {loading ? "Aguarde..." : modo === "cadastro" ? "Criar conta" : "Entrar"}
        </button>

        <button
          onClick={() => { setModo(modo === "cadastro" ? "login" : "cadastro"); setError(""); }}
          className="w-full text-center text-xs mt-4"
          style={{ color: "#6E6E73" }}
        >
          {modo === "cadastro" ? "Já tem conta? Entrar" : "Não tem conta? Criar agora"}
        </button>
      </div>
      <div className="max-w-sm w-full">
        <ContactFooter />
      </div>
    </div>
  );
}

function AuthGate() {
  const [status, setStatus] = useState("loading"); // "loading" | "out" | "in"
  const [currentUser, setCurrentUser] = useState(null);

  useEffect(() => {
    const unsubscribe = auth.onAuthStateChanged((user) => {
      setCurrentUser(user);
      setStatus(user ? "in" : "out");
    });
    return unsubscribe;
  }, []);

  if (status === "loading") {
    return (
      <div className="min-h-screen w-full flex items-center justify-center" style={{ background: "#F5F5F7" }}>
        <p className="text-sm" style={{ color: "#6E6E73" }}>Carregando...</p>
      </div>
    );
  }

  if (status === "out") {
    return <CadastroLogin />;
  }

  return <App user={currentUser} />;
}


/* =========================================================================
   Design: painel de aparelho de eletroestimulação — tela tipo osciloscópio
   com traço fósforo verde, chassi escuro, leitura em LCD mono.

   Estrutura alinhada ao slide "Podem ser classificadas": tipo de corrente,
   polaridade (resultante — polarizada/despolarizada), número de fases e
   formato de onda são tratados como eixos que se combinam, não um menu único.
   ========================================================================= */

const TIPOS = [
  { id: "cc", label: "Corrente Contínua (CC)" },
  { id: "ca", label: "Corrente Alternada (CA)" },
  { id: "pulsada", label: "Corrente Pulsada" },
];

const FORMATOS = [
  { id: "quadrada", label: "Quadrada" },
  { id: "triangular", label: "Triangular" },
  { id: "sinusoidal", label: "Sinusoidal" },
  { id: "trapezoidal", label: "Trapezoidal" },
];

function clinicalNote(tipo, numFases, simetria) {
  if (tipo === "cc") return "Fluxo unidirecional constante. Base da iontoforese e de efeitos polares (atração/repulsão iônica sob os eletrodos). Sempre polarizada.";
  if (tipo === "ca") return "Corrente sinusoidal bidirecional, sem componente polar líquido. Sempre despolarizada — não gera efeitos químicos cumulativos sob os eletrodos.";
  if (tipo === "pulsada" && numFases === "mono") return "Pulsos unidirecionais, com período de repouso entre eles. Sempre polarizada — requer atenção à carga acumulada por fase.";
  if (tipo === "pulsada" && numFases === "bi" && simetria === "simetrica") return "Cada fase é espelho da outra — carga líquida zero, despolarizada. Minimiza risco de irritação cutânea. Comum em TENS convencional.";
  if (tipo === "pulsada" && numFases === "bi" && simetria === "assimetrica") return "Fases com amplitude/duração diferentes, mas carga balanceada (mesma área sob a curva) — despolarizada. Comum em NMES para contração muscular.";
  return "";
}

function polaridadeResultante(tipo, numFases) {
  if (tipo === "cc") return "polarizada";
  if (tipo === "ca") return "despolarizada";
  if (tipo === "pulsada" && numFases === "mono") return "polarizada";
  return "despolarizada";
}

function SimuladorCorrentes({ onBack }) {
  const [tipo, setTipo] = useState("pulsada");
  const [numFases, setNumFases] = useState("bi");
  const [simetria, setSimetria] = useState("simetrica");
  const [formato, setFormato] = useState("quadrada");
  const [polo, setPolo] = useState(1);

  const [frequency, setFrequency] = useState(50);
  const [pulseWidth, setPulseWidth] = useState(10);
  const [phase2Width, setPhase2Width] = useState(20);
  const [intensity, setIntensity] = useState(20);
  const [showInfo, setShowInfo] = useState(false);
  const [presentMode, setPresentMode] = useState(false);
  const [controlsOpen, setControlsOpen] = useState(false);

  const canvasRef = useRef(null);

  const WINDOW_MS = 1000;
  const MAX_MA = 100;

  const showFases = tipo === "pulsada";
  const showSimetria = tipo === "pulsada" && numFases === "bi";
  const showFormato = tipo === "pulsada";
  const showPolo = tipo === "cc";
  const showFrequency = tipo !== "cc";
  const showPulseWidth = tipo === "pulsada";
  const showPhase2 = tipo === "pulsada" && numFases === "bi" && simetria === "assimetrica";

  const polaridade = polaridadeResultante(tipo, numFases);

  function addPhase(pts, tStart, durationMs, amplitude, shape) {
    const push = (t, y) => pts.push({ t, y });
    if (durationMs <= 0) return;
    if (shape === "quadrada") {
      push(tStart, 0);
      push(tStart, amplitude);
      push(tStart + durationMs, amplitude);
      push(tStart + durationMs, 0);
    } else if (shape === "triangular") {
      push(tStart, 0);
      push(tStart + durationMs / 2, amplitude);
      push(tStart + durationMs, 0);
    } else if (shape === "trapezoidal") {
      const rise = durationMs * 0.25;
      push(tStart, 0);
      push(tStart + rise, amplitude);
      push(tStart + durationMs - rise, amplitude);
      push(tStart + durationMs, 0);
    } else if (shape === "sinusoidal") {
      const steps = 12;
      for (let i = 0; i <= steps; i++) {
        const t = tStart + (durationMs * i) / steps;
        const y = amplitude * Math.sin((Math.PI * i) / steps);
        push(t, y);
      }
    }
  }

  function buildPoints() {
    const pts = [];
    const push = (t, y) => pts.push({ t, y });

    if (tipo === "cc") {
      push(0, intensity * polo);
      push(WINDOW_MS, intensity * polo);
      return pts;
    }

    if (tipo === "ca") {
      const steps = 600;
      for (let i = 0; i <= steps; i++) {
        const t = (WINDOW_MS * i) / steps;
        const y = intensity * Math.sin((2 * Math.PI * frequency * t) / 1000);
        push(t, y);
      }
      return pts;
    }

    const period = 1000 / frequency;
    const pw1 = pulseWidth;
    const pw2 = phase2Width;
    const amp2 =
      numFases === "bi"
        ? simetria === "simetrica"
          ? intensity
          : (intensity * pulseWidth) / Math.max(phase2Width, 1)
        : 0;

    let t = 0;
    push(0, 0);
    while (t < WINDOW_MS) {
      addPhase(pts, t, pw1, intensity, formato);
      let cursor = t + pw1;
      if (numFases === "bi") {
        const dur2 = simetria === "simetrica" ? pw1 : pw2;
        addPhase(pts, cursor, dur2, -amp2, formato);
        cursor += dur2;
      }
      push(Math.min(cursor, WINDOW_MS), 0);
      t = Math.max(t + period, cursor);
      push(Math.min(t, WINDOW_MS), 0);
    }
    return pts;
  }

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;
    const padL = 58, padR = 16, padT = 16, padB = 28;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#07130D";
    ctx.fillRect(0, 0, W, H);

    const yZero = padT + plotH / 2;
    const xScale = plotW / WINDOW_MS;
    const yScale = (plotH / 2) / MAX_MA;

    ctx.strokeStyle = "rgba(74,255,140,0.14)";
    ctx.lineWidth = 1;
    const gridLinesX = 10;
    for (let i = 0; i <= gridLinesX; i++) {
      const x = padL + (plotW * i) / gridLinesX;
      ctx.beginPath();
      ctx.moveTo(x, padT);
      ctx.lineTo(x, padT + plotH);
      ctx.stroke();
    }
    const gridLinesY = 4;
    for (let i = 0; i <= gridLinesY; i++) {
      const y = padT + (plotH * i) / gridLinesY;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + plotW, y);
      ctx.stroke();
    }

    ctx.strokeStyle = "rgba(74,255,140,0.35)";
    ctx.beginPath();
    ctx.moveTo(padL, yZero);
    ctx.lineTo(padL + plotW, yZero);
    ctx.stroke();

    ctx.fillStyle = "#6FE3A3";
    ctx.font = "13px 'IBM Plex Mono', monospace";
    ctx.fillText(`+${MAX_MA} mA`, 4, padT + 8);
    ctx.fillText(`-${MAX_MA} mA`, 4, padT + plotH);
    ctx.fillText("0", 4, yZero + 3);
    ctx.fillText(`${WINDOW_MS} ms (1 s)`, padL + plotW - 62, padT + plotH + 18);
    ctx.fillText("0 ms", padL, padT + plotH + 18);

    const pts = buildPoints();
    ctx.strokeStyle = "#4AFF8C";
    ctx.lineWidth = 2;
    ctx.shadowColor = "#4AFF8C";
    ctx.shadowBlur = 6;
    ctx.beginPath();
    pts.forEach((p, i) => {
      const x = padL + p.t * xScale;
      const y = yZero - Math.max(-MAX_MA, Math.min(MAX_MA, p.y)) * yScale;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.shadowBlur = 0;
  }, [tipo, numFases, simetria, formato, polo, frequency, pulseWidth, phase2Width, intensity, presentMode]);

  return (
    <div className="min-h-screen w-full" style={{ background: "#12161B", fontFamily: "'IBM Plex Sans', sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        .font-display { font-family: 'Oswald', sans-serif; letter-spacing: 0.02em; }
        .font-mono { font-family: 'IBM Plex Mono', monospace; }
        input[type="range"] {
          -webkit-appearance: none;
          height: 4px;
          border-radius: 2px;
          background: #3A4650;
        }
        input[type="range"]::-webkit-slider-thumb {
          -webkit-appearance: none;
          width: 16px; height: 16px; border-radius: 50%;
          background: #E8892C; border: 2px solid #FFDCB0; cursor: pointer;
          margin-top: -6px;
        }
        input[type="range"]::-moz-range-thumb {
          width: 16px; height: 16px; border-radius: 50%;
          background: #E8892C; border: 2px solid #FFDCB0; cursor: pointer;
        }
      `}</style>

      {!presentMode && (
        <div className="px-5 pb-4 border-b flex items-center justify-between" style={{ borderColor: "#262D35", background: "#171B21", paddingTop: "calc(env(safe-area-inset-top) + 1.25rem)" }}>
          <div>
            <h1 className="font-display text-2xl" style={{ color: "#F2EFE6" }}>
              SIMULADOR DE CORRENTES
            </h1>
            <p className="font-mono text-xs tracking-widest uppercase" style={{ color: "#E8892C" }}>
              by OrtoFlix
            </p>
          </div>
          {onBack && (
            <button
              onClick={onBack}
              className="font-mono text-xs px-3 py-1.5 rounded border whitespace-nowrap"
              style={{ color: "#8A94A0", borderColor: "#3A4650", background: "#0F1318" }}
            >
              ← FisioLab
            </button>
          )}
        </div>
      )}

      <div className={presentMode ? "p-3 flex flex-col gap-3" : "p-4 md:p-6 grid grid-cols-1 lg:grid-cols-[1fr_380px] gap-5 max-w-6xl mx-auto"}>
        <div className="rounded-lg p-3 md:p-4 sticky top-2 z-10 relative" style={{ background: "#171B21", border: "1px solid #262D35" }}>
          <button
            onClick={() => { setPresentMode((v) => !v); setControlsOpen(false); }}
            aria-label={presentMode ? "Sair do modo apresentação" : "Modo apresentação"}
            title={presentMode ? "Sair do modo apresentação" : "Modo apresentação"}
            className="absolute top-3 right-3 z-20 w-8 h-8 rounded flex items-center justify-center border"
            style={{ color: "#E8892C", borderColor: "#3A4650", background: "#0F1318" }}
          >
            {presentMode ? (
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4M15 21h4a2 2 0 0 0 2-2v-4" />
              </svg>
            ) : (
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M3 9V5a2 2 0 0 1 2-2h4M17 3h4a2 2 0 0 1 2 2v4M21 15v4a2 2 0 0 1-2 2h-4M7 21H3a2 2 0 0 1-2-2v-4" />
              </svg>
            )}
          </button>
          <div className="flex items-center justify-between mb-2 flex-wrap gap-2 pr-10">
            <p className="font-mono text-xs uppercase tracking-widest" style={{ color: "#6FE3A3" }}>
              Forma de onda
            </p>
            <p className="font-mono text-xs text-right" style={{ color: "#6FE3A3" }}>
              {TIPOS.find((t) => t.id === tipo)?.label}
              {showFases && (numFases === "mono" ? " · Monofásica" : ` · Bifásica ${simetria === "simetrica" ? "simétrica" : "assimétrica"}`)}
              {showFormato && ` · ${FORMATOS.find((f) => f.id === formato)?.label}`}
            </p>
          </div>
          <canvas
            ref={canvasRef}
            width={presentMode ? 1400 : 900}
            height={presentMode ? 560 : 360}
            className="w-full rounded"

function Slider({ label, value, unit, min, max, step, onChange }) {
  return (
    <div>
      <div className="flex items-center justify-between mb-1">
        <label className="font-mono text-xs uppercase tracking-widest" style={{ color: "#8A94A0" }}>{label}</label>
        <span className="font-mono text-sm px-2 py-0.5 rounded" style={{ background: "#0F1318", color: "#E8892C", border: "1px solid #3A4650" }}>
          {value} {unit}
        </span>
      </div>
      <input
        type="range"
        min={min}
        max={max}
        step={step}
        value={value}
        onChange={(e) => onChange(Number(e.target.value))}
        className="w-full"
      />
    </div>
  );
}


/* =========================================================================
   PALAVRAS CRUZADAS — motor de geração + interface de jogo.
   Para criar um novo banco de palavras, monte um array de
   { answer, clue } e chame generateCrossword(words) — o layout é
   calculado automaticamente (posições, interseções, numeração).
   ========================================================================= */

function normalizeAnswer(word) {
  return word
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function generateCrossword(rawWords) {
  const words = rawWords
    .map((w) => ({ ...w, answer: normalizeAnswer(w.answer) }))
    .sort((a, b) => b.answer.length - a.answer.length);

  const cells = new Map();
  const placements = [];

  function canPlace(word, x, y, dir) {
    let intersections = 0;
    for (let i = 0; i < word.length; i++) {
      const cx = dir === "H" ? x + i : x;
      const cy = dir === "V" ? y + i : y;
      const key = `${cx},${cy}`;
      const existing = cells.get(key);
      if (existing) {
        if (existing !== word[i]) return null;
        intersections++;
      } else {
        if (dir === "H") {
          if (cells.has(`${cx},${cy - 1}`) || cells.has(`${cx},${cy + 1}`)) return null;
        } else {
          if (cells.has(`${cx - 1},${cy}`) || cells.has(`${cx + 1},${cy}`)) return null;
        }
      }
    }
    const beforeX = dir === "H" ? x - 1 : x;
    const beforeY = dir === "V" ? y - 1 : y;
    const afterX = dir === "H" ? x + word.length : x;
    const afterY = dir === "V" ? y + word.length : y;
    if (cells.has(`${beforeX},${beforeY}`) || cells.has(`${afterX},${afterY}`)) return null;
    return intersections;
  }

  function place(word, x, y, dir) {
    for (let i = 0; i < word.length; i++) {
      const cx = dir === "H" ? x + i : x;
      const cy = dir === "V" ? y + i : y;
      cells.set(`${cx},${cy}`, word[i]);
    }
  }

  function tryPlaceAgainstExisting(w) {
    let best = null;
    for (const placed of placements) {
      for (let i = 0; i < w.answer.length; i++) {
        for (let j = 0; j < placed.answer.length; j++) {
          if (w.answer[i] !== placed.answer[j]) continue;
          const newDir = placed.dir === "H" ? "V" : "H";
          let x, y;
          if (placed.dir === "H") {
            x = placed.x + j;
            y = placed.y - i;
          } else {
            x = placed.x - i;
            y = placed.y + j;
          }
          const score = canPlace(w.answer, x, y, newDir);
          if (score !== null && score > 0) {
            if (!best || score > best.score) best = { x, y, dir: newDir, score };
          }
        }
      }
    }
    return best;
  }

  place(words[0].answer, 0, 0, "H");
  placements.push({ ...words[0], x: 0, y: 0, dir: "H" });

  for (let idx = 1; idx < words.length; idx++) {
    const best = tryPlaceAgainstExisting(words[idx]);
    if (best) {
      place(words[idx].answer, best.x, best.y, best.dir);
      placements.push({ ...words[idx], x: best.x, y: best.y, dir: best.dir });
    }
  }
  const placedAnswers = new Set(placements.map((p) => p.answer));
  for (const w of words.filter((w) => !placedAnswers.has(w.answer))) {
    const best = tryPlaceAgainstExisting(w);
    if (best) {
      place(w.answer, best.x, best.y, best.dir);
      placements.push({ ...w, x: best.x, y: best.y, dir: best.dir });
    }
  }

  let minX = 0, minY = 0, maxX = 0, maxY = 0;
  for (const p of placements) {
    const endX = p.dir === "H" ? p.x + p.answer.length - 1 : p.x;
    const endY = p.dir === "V" ? p.y + p.answer.length - 1 : p.y;
    minX = Math.min(minX, p.x, endX);
    minY = Math.min(minY, p.y, endY);
    maxX = Math.max(maxX, p.x, endX);
    maxY = Math.max(maxY, p.y, endY);
  }
  const normalized = placements.map((p) => ({ ...p, x: p.x - minX, y: p.y - minY }));
  const width = maxX - minX + 1;
  const height = maxY - minY + 1;

  // numeração: ordena os pontos de início em ordem de leitura (linha, depois coluna)
  const starts = [...normalized].sort((a, b) => (a.y - b.y) || (a.x - b.x));
  const numberByCoord = new Map();
  let n = 0;
  for (const p of starts) {
    const key = `${p.x},${p.y}`;
    if (!numberByCoord.has(key)) {
      n++;
      numberByCoord.set(key, n);
    }
  }
  const numbered = normalized.map((p) => ({ ...p, number: numberByCoord.get(`${p.x},${p.y}`) }));

  return { placements: numbered, width, height };
}

const KINESIO_WORDS = [
  { answer: "ALAVANCA", clue: "Sistema mecânico formado por uma barra rígida que gira em torno de um ponto fixo." },
  { answer: "TORQUE", clue: "Medida da força de rotação em torno de um eixo; também chamado de momento de força." },
  { answer: "FULCRO", clue: "Ponto de apoio ou eixo de rotação de uma alavanca." },
  { answer: "AGONISTA", clue: "Músculo principal responsável por produzir um movimento específico." },
  { answer: "ANTAGONISTA", clue: "Músculo que se opõe à ação do motor primário." },
  { answer: "SINERGISTA", clue: "Músculo que auxilia o agonista a realizar o movimento com eficiência." },
  { answer: "ISOMETRICA", clue: "Tipo de contração muscular em que o comprimento do músculo não se altera." },
  { answer: "CONCENTRICA", clue: "Tipo de contração em que o músculo se encurta durante a produção de força." },
  { answer: "EXCENTRICA", clue: "Tipo de contração em que o músculo se alonga enquanto produz força." },
  { answer: "GONIOMETRO", clue: "Instrumento utilizado para medir a amplitude de movimento articular." },
  { answer: "SAGITAL", clue: "Plano que divide o corpo em lados direito e esquerdo." },
  { answer: "TRANSVERSO", clue: "Plano que divide o corpo em partes superior e inferior." },
  { answer: "CINETICA", clue: "Ramo da biomecânica que estuda as forças que causam o movimento." },
  { answer: "CINEMATICA", clue: "Ramo da biomecânica que descreve o movimento sem considerar suas causas." },
];

function Cruzadinha({ onBack, words, titulo, subtitulo }) {
  const { useState, useMemo, useRef } = React;
  const puzzle = useMemo(() => generateCrossword(words), [words]);
  const [values, setValues] = useState({});
  const [checked, setChecked] = useState(false);
  const inputRefs = useRef({});

  const solutionByCell = useMemo(() => {
    const map = new Map();
    for (const p of puzzle.placements) {
      for (let i = 0; i < p.answer.length; i++) {
        const x = p.dir === "H" ? p.x + i : p.x;
        const y = p.dir === "V" ? p.y + i : p.y;
        map.set(`${x},${y}`, p.answer[i]);
      }
    }
    return map;
  }, [puzzle]);

  const startNumberByCell = useMemo(() => {
    const map = new Map();
    for (const p of puzzle.placements) {
      map.set(`${p.x},${p.y}`, p.number);
    }
    return map;
  }, [puzzle]);

  const uniqueCells = useMemo(() => {
    const list = [...solutionByCell.keys()].map((key) => {
      const [x, y] = key.split(",").map(Number);
      return { key, x, y };
    });
    list.sort((a, b) => a.y - b.y || a.x - b.x);
    return list;
  }, [solutionByCell]);

  const cellOrder = useMemo(() => {
    // ordem de tabulação: por palavra, na ordem de leitura (sem repetir interseções)
    const ordered = [];
    const seen = new Set();
    const sorted = [...puzzle.placements].sort((a, b) => a.number - b.number || (a.dir === "H" ? -1 : 1));
    for (const p of sorted) {
      for (let i = 0; i < p.answer.length; i++) {
        const x = p.dir === "H" ? p.x + i : p.x;
        const y = p.dir === "V" ? p.y + i : p.y;
        const key = `${x},${y}`;
        if (!seen.has(key)) {
          seen.add(key);
          ordered.push(key);
        }
      }
    }
    return ordered;
  }, [puzzle]);

  function handleChange(key, raw) {
    const letter = normalizeAnswer(raw).slice(-1);
    setValues((v) => ({ ...v, [key]: letter }));
    setChecked(false);
    if (letter) {
      const idx = cellOrder.indexOf(key);
      const next = cellOrder[idx + 1];
      if (next && inputRefs.current[next]) inputRefs.current[next].focus();
    }
  }

  function handleKeyDown(key, e) {
    if (e.key === "Backspace" && !values[key]) {
      const idx = cellOrder.indexOf(key);
      const prev = cellOrder[idx - 1];
      if (prev && inputRefs.current[prev]) inputRefs.current[prev].focus();
    }
  }

  function verificar() {
    setChecked(true);
  }

  function limpar() {
    setValues({});
    setChecked(false);
  }

  const totalCells = solutionByCell.size;
  const correctCells = [...solutionByCell.entries()].filter(([k, letter]) => values[k] === letter).length;
  const completo = checked && correctCells === totalCells;

  const cellSize = 30;

  const horizontais = puzzle.placements.filter((p) => p.dir === "H").sort((a, b) => a.number - b.number);
  const verticais = puzzle.placements.filter((p) => p.dir === "V").sort((a, b) => a.number - b.number);

  return (
    <div
      className="min-h-screen w-full"
      style={{
        background: "#F5F5F7",
        userSelect: "none",
        WebkitUserSelect: "none",
        MozUserSelect: "none",
        msUserSelect: "none",
        WebkitTouchCallout: "none",
      }}
      onCopy={(e) => e.preventDefault()}
      onCut={(e) => e.preventDefault()}
      onContextMenu={(e) => e.preventDefault()}
    >
      <div
        className="px-5 pb-4 border-b flex items-center justify-between"
        style={{ borderColor: "#E5E5EA", background: "#FFFFFF", paddingTop: "calc(env(safe-area-inset-top) + 1.25rem)" }}
      >
        <div>
          <h1 className="text-xl font-bold" style={{ color: "#1D1D1F" }}>{titulo}</h1>
          <p className="text-sm" style={{ color: "#6E6E73" }}>{subtitulo}</p>
        </div>
        {onBack && (
          <button
            onClick={onBack}
            className="text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap"
            style={{ background: "#F5F5F7", border: "1px solid #E5E5EA", color: "#6E6E73" }}
          >
            ← FisioLab
          </button>
        )}
      </div>

      <div className="p-4 max-w-3xl mx-auto">
        <div className="overflow-x-auto pb-2">
          <div
            style={{
              position: "relative",
              width: puzzle.width * cellSize,
              height: puzzle.height * cellSize,
              margin: "0 auto",
            }}
          >
            {uniqueCells.map(({ key, x, y }) => {
              const startNumber = startNumberByCell.get(key) || null;
              const value = values[key] || "";
              const solution = solutionByCell.get(key);
              const isCorrect = checked && value === solution;
              const isWrong = checked && value && value !== solution;
              return (
                <div
                  key={key}
                  style={{
                    position: "absolute",
                    left: x * cellSize,
                    top: y * cellSize,
                    width: cellSize,
                    height: cellSize,
                  }}
                >
                  {startNumber && (
                    <span
                      style={{
                        position: "absolute",
                        top: 1,
                        left: 2,
                        fontSize: 8,
                        color: "#9A9AA0",
                        zIndex: 2,
                        pointerEvents: "none",
                      }}
                    >
                      {startNumber}
                    </span>
                  )}
                  <input
                    ref={(el) => (inputRefs.current[key] = el)}
                    value={value}
                    onChange={(e) => handleChange(key, e.target.value)}
                    onKeyDown={(e) => handleKeyDown(key, e)}
                    maxLength={1}
                    className="text-center font-semibold"
                    style={{
                      width: "100%",
                      height: "100%",
                      border: `1px solid ${isCorrect ? "#22C55E" : isWrong ? "#EF4444" : "#D2D2D7"}`,
                      background: isCorrect ? "#DCFCE7" : isWrong ? "#FEE2E2" : "#FFFFFF",
                      color: "#1D1D1F",
                      fontSize: 14,
                      outline: "none",
                      padding: 0,
                    }}
                  />
                </div>
              );
            })}
          </div>
        </div>

        <div className="flex gap-2 justify-center my-4">
          <button
            onClick={verificar}
            className="text-sm font-semibold px-5 py-2.5 rounded-full"
            style={{ background: "#22C55E", color: "#FFFFFF" }}
          >
            Verificar
          </button>
          <button
            onClick={limpar}
            className="text-sm font-medium px-5 py-2.5 rounded-full"
            style={{ background: "#FFFFFF", border: "1px solid #E5E5EA", color: "#6E6E73" }}
          >
            Limpar
          </button>
        </div>

        {checked && (
          <p className="text-center text-sm mb-4" style={{ color: completo ? "#22C55E" : "#6E6E73" }}>
            {completo ? "🎉 Completo! Todas as respostas corretas." : `${correctCells} de ${totalCells} letras corretas.`}
          </p>
        )}

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div className="rounded-2xl p-4" style={{ background: "#FFFFFF", border: "1px solid #E5E5EA" }}>
            <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: "#22C55E" }}>Horizontais</p>
            {horizontais.map((p) => (
              <p key={p.number + "H"} className="text-sm mb-2" style={{ color: "#1D1D1F" }}>
                <strong>{p.number}.</strong> {p.clue}
              </p>
            ))}
          </div>

function shuffleDeck(deck) {
  const arr = [...deck];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function SuperTrunfo({ onBack }) {
  const { useState, useMemo } = React;
  const [order, setOrder] = useState(() => shuffleDeck(TRUNFO_CARTAS));
  const [index, setIndex] = useState(0);
  const [rodada, setRodada] = useState(1);
  const [showHelp, setShowHelp] = useState(false);

  const carta = order[index];

  function proximaCarta() {
    if (index + 1 >= order.length) {
      setOrder(shuffleDeck(TRUNFO_CARTAS));
      setIndex(0);
    } else {
      setIndex(index + 1);
    }
    setRodada((r) => r + 1);
  }

  function embaralharDeNovo() {
    setOrder(shuffleDeck(TRUNFO_CARTAS));
    setIndex(0);
    setRodada(1);
  }

  const maxByAttr = useMemo(() => {
    const map = {};
    for (const attr of TRUNFO_ATRIBUTOS) {
      map[attr.key] = Math.max(...TRUNFO_CARTAS.map((c) => c[attr.key]));
    }
    return map;
  }, []);

  return (

            style={{ background: "#F5F5F7", border: "1px solid #E5E5EA", color: "#6E6E73" }}

const ALAVANCA_INFO = {
  interfixa: {
    nome: "Interfixa",
    exemplo: "Extensão de cotovelo pelo tríceps: o eixo (cotovelo) fica entre a força da potência (tríceps) e a força da resistência (antebraço/carga).",

  },
  interpotente: {
    nome: "Interpotente",
    exemplo: "Flexão de cotovelo pelo bíceps: a força da potência (bíceps) fica entre o eixo (cotovelo) e a força da resistência (mão/carga). É a mais comum no corpo humano.",
  },
};

function classificarAlavanca(posEixo, posPotencia, posResistencia) {
  const pontos = [
    { key: "interfixa", pos: posEixo },
    { key: "inter-resistente", pos: posResistencia },
    { key: "interpotente", pos: posPotencia },
  ];
  const ordenados = [...pontos].sort((a, b) => a.pos - b.pos);
  return ordenados[1].key;
}

function VisualizadorAlavancas({ onBack }) {
  const { useState } = React;
  const [posEixo, setPosEixo] = useState(10);
  const [posPotencia, setPosPotencia] = useState(30);
  const [posResistencia, setPosResistencia] = useState(90);
  const [forcaPotencia, setForcaPotencia] = useState(40);
  const [forcaResistencia, setForcaResistencia] = useState(20);
  const [travar, setTravar] = useState("nenhum"); // "nenhum" | "forca" | "posicao"

  const bracoPotencia = Math.abs(posPotencia - posEixo);
  const bracoResistencia = Math.abs(posResistencia - posEixo);

  const torquePotencia = forcaPotencia * bracoPotencia;
  const torqueResistencia = forcaResistencia * bracoResistencia;
  const vantagemMecanica = bracoResistencia > 0 ? bracoPotencia / bracoResistencia : Infinity;
  const diff = torquePotencia - torqueResistencia;

  const classeAtual = classificarAlavanca(posEixo, posPotencia, posResistencia);
  const info = ALAVANCA_INFO[classeAtual];

  let resultado, corResultado, contracao;
  const EPS = torqueResistencia * 0.03;
  if (Math.abs(diff) <= Math.max(EPS, 5)) {
    resultado = "Equilíbrio";
    contracao = "Contração ISOMÉTRICA";
    corResultado = "#6E6E73";
  } else if (diff > 0) {
    resultado = "Gira a favor da potência";
    contracao = "Contração CONCÊNTRICA (o músculo encurta)";
    corResultado = "#22C55E";
  } else {
    resultado = "Gira a favor da resistência";
    contracao = "Contração EXCÊNTRICA (o músculo alonga controlando)";
    corResultado = "#EF4444";
  }

  const anguloMax = 18;
  const escala = Math.max(torquePotencia, torqueResistencia, 1);
  const angulo = Math.max(-anguloMax, Math.min(anguloMax, (diff / escala) * anguloMax));

  // ---- geometria: barra fixa de 100 cm, mapeada para -110..+110 px ----
  const BAR_PX = 220;

            {[

              >
                {m.label}
              </button>
            ))}
          </div>
        </div>

        {/* Controles de posição (barra fixa de 100cm) */}
        <div className="rounded-2xl p-4 mb-4" style={{ background: "#FFFFFF", border: "1px solid #E5E5EA" }}>
          <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: "#9A9AA0" }}>Posição na barra (0 a 100 cm)</p>
          <Slider label="Posição do Eixo (E)" value={posEixo} onChange={setPosEixo} min={0} max={100} unidade="cm" disabled={travar === "posicao"} accent="#1D1D1F" />
          <Slider label="Posição de FP" value={posPotencia} onChange={setPosPotencia} min={0} max={100} unidade="cm" disabled={travar === "posicao"} accent="#2563EB" />
          <Slider label="Posição de FR" value={posResistencia} onChange={setPosResistencia} min={0} max={100} unidade="cm" disabled={travar === "posicao"} accent="#EF4444" />
        </div>

        {/* Controles de força */}
        <div className="rounded-2xl p-4 mb-4" style={{ background: "#FFFFFF", border: "1px solid #E5E5EA" }}>
          <Slider label="Força da Potência (FP)" value={forcaPotencia} onChange={setForcaPotencia} min={1} max={100} unidade="Kgf" disabled={travar === "forca"} />
          <Slider label="Força da Resistência (FR)" value={forcaResistencia} onChange={setForcaResistencia} min={1} max={100} unidade="Kgf" disabled={travar === "forca"} />
        </div>

        {/* Notas educacionais */}
        <div className="rounded-2xl p-4 mb-4 space-y-2" style={{ background: "#FFFFFF", border: "1px solid #E5E5EA" }}>
          <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: "#22C55E" }}>Por que isso importa</p>
          <p className="text-sm leading-relaxed" style={{ color: "#1D1D1F" }}>
            A maioria das alavancas do corpo humano é interpotente, com desvantagem mecânica (VM &lt; 1)
            — o corpo troca força por velocidade e amplitude de movimento.
          </p>
          <p className="text-sm leading-relaxed" style={{ color: "#1D1D1F" }}>
            Na prescrição de exercícios: aumentar a distância da carga ao eixo deixa o exercício mais
            difícil sem precisar aumentar o peso — por isso estender o braço numa rosca direta aumenta a
            dificuldade percebida mesmo com a mesma carga.
          </p>
        </div>

        <ContactFooter />
      </div>
    </div>
  );
}

];

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function JogoPosicionamento({ onBack }) {
  const { useState, useEffect, useRef } = React;
  const ROUND_TIME = 8;

  const [fase, setFase] = useState("intro"); // "intro" | "jogando" | "fim"
  const [rodadas, setRodadas] = useState([]);
  const [indice, setIndice] = useState(0);
  const [tempo, setTempo] = useState(ROUND_TIME);
  const [pontuacao, setPontuacao] = useState(0);
  const [selecionado, setSelecionado] = useState(null);
  const [travarToque, setTravarToque] = useState(false);
  const timerRef = useRef(null);

  function iniciar() {
    setRodadas(shuffleArray(POSICAO_RODADAS));
    setIndice(0);
    setPontuacao(0);
    setTempo(ROUND_TIME);
    setSelecionado(null);
    setTravarToque(false);
    setFase("jogando");
  }

  const rodadaAtual = rodadas[indice];

  useEffect(() => {
    if (fase !== "jogando") return;
    if (timerRef.current) clearInterval(timerRef.current);
    timerRef.current = setInterval(() => {
      setTempo((t) => {
        if (t <= 1) {
          clearInterval(timerRef.current);
          avancar(false, null);
          return 0;
        }
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
    // eslint-disable-next-line
  }, [fase, indice]);

  function avancar(acertou, idTocado) {
    setTravarToque(true);
    setSelecionado(idTocado);
    if (acertou) setPontuacao((p) => p + 1);
    setTimeout(() => {
      setSelecionado(null);
      setTravarToque(false);
      if (indice + 1 >= rodadas.length) {
        setFase("fim");
      } else {
        setIndice((i) => i + 1);
        setTempo(ROUND_TIME);
      }
    }, 700);
  }

  function handleTap(opcao) {
    if (travarToque) return;
    if (timerRef.current) clearInterval(timerRef.current);
    avancar(opcao.correta, opcao.id);
  }

  return (
    <div className="min-h-screen w-full" style={{ background: "#F5F5F7" }}>
      <div
        className="px-5 pb-4 border-b flex items-center justify-between"
        style={{ borderColor: "#E5E5EA", background: "#FFFFFF", paddingTop: "calc(env(safe-area-inset-top) + 1.25rem)" }}
      >
        <div>
          <h1 className="text-xl font-bold" style={{ color: "#1D1D1F" }}>Posicionamento Anatômico</h1>
          <p className="text-sm" style={{ color: "#6E6E73" }}>Cinesiologia e Biomecânica</p>
        </div>
        {onBack && (
          <button
            onClick={onBack}
            className="text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap"
            style={{ background: "#F5F5F7", border: "1px solid #E5E5EA", color: "#6E6E73" }}
          >
            ← FisioLab
          </button>
        )}
      </div>

      <div className="p-4 max-w-md mx-auto">
        {fase === "intro" && (
          <div className="rounded-2xl p-5 text-center" style={{ background: "#FFFFFF", border: "1px solid #E5E5EA" }}>
            <p className="text-sm leading-relaxed mb-4" style={{ color: "#1D1D1F" }}>
              Toque no ponto certo do corpo antes que o tempo acabe. {POSICAO_RODADAS.length} rodadas,
              {" "}{ROUND_TIME}s cada — testa proximal/distal, medial/lateral e superior/inferior.
            </p>
            <button onClick={iniciar} className="w-full py-2.5 rounded-full text-sm font-semibold" style={{ background: "#22C55E", color: "#FFFFFF" }}>
              Começar
            </button>
          </div>
        )}

        {fase === "jogando" && rodadaAtual && (
          <>
            <div className="flex items-center justify-between mb-3">
              <p className="text-xs font-semibold" style={{ color: "#6E6E73" }}>
                Rodada {indice + 1}/{rodadas.length} · Pontos: {pontuacao}
              </p>
              <span
                className="text-xs font-bold px-2.5 py-1 rounded-full"
                style={{ background: tempo <= 3 ? "#FEE2E2" : "#EAFBF0", color: tempo <= 3 ? "#DC2626" : "#16A34A" }}
              >
                {tempo}s
              </span>
            </div>

            <div className="rounded-2xl p-4 mb-4" style={{ background: "#FFFFFF", border: "1px solid #E5E5EA" }}>
              <p className="text-sm font-semibold text-center mb-3" style={{ color: "#1D1D1F" }}>
                {rodadaAtual.texto}
              </p>

              <svg viewBox="0 0 200 420" width="100%" height="360">
                {/* silhueta simplificada (esqueleto de linhas) */}
                <g stroke="#D2D2D7" strokeWidth="6" strokeLinecap="round" fill="none">
                  <line x1={POSICAO_PONTOS.pescoco.x} y1={POSICAO_PONTOS.pescoco.y} x2={POSICAO_PONTOS.quadril.x} y2={POSICAO_PONTOS.quadril.y} />
                  <line x1={POSICAO_PONTOS.ombroA.x} y1={POSICAO_PONTOS.ombroA.y} x2={POSICAO_PONTOS.ombroB.x} y2={POSICAO_PONTOS.ombroB.y} />
                  <line x1={POSICAO_PONTOS.ombroA.x} y1={POSICAO_PONTOS.ombroA.y} x2={POSICAO_PONTOS.cotoveloA.x} y2={POSICAO_PONTOS.cotoveloA.y} />
                  <line x1={POSICAO_PONTOS.cotoveloA.x} y1={POSICAO_PONTOS.cotoveloA.y} x2={POSICAO_PONTOS.punhoA.x} y2={POSICAO_PONTOS.punhoA.y} />
                  <line x1={POSICAO_PONTOS.punhoA.x} y1={POSICAO_PONTOS.punhoA.y} x2={POSICAO_PONTOS.maoA.x} y2={POSICAO_PONTOS.maoA.y} />
                  <line x1={POSICAO_PONTOS.ombroB.x} y1={POSICAO_PONTOS.ombroB.y} x2={POSICAO_PONTOS.cotoveloB.x} y2={POSICAO_PONTOS.cotoveloB.y} />
                  <line x1={POSICAO_PONTOS.cotoveloB.x} y1={POSICAO_PONTOS.cotoveloB.y} x2={POSICAO_PONTOS.punhoB.x} y2={POSICAO_PONTOS.punhoB.y} />
                  <line x1={POSICAO_PONTOS.punhoB.x} y1={POSICAO_PONTOS.punhoB.y} x2={POSICAO_PONTOS.maoB.x} y2={POSICAO_PONTOS.maoB.y} />
                  <line x1={POSICAO_PONTOS.quadrilA.x} y1={POSICAO_PONTOS.quadrilA.y} x2={POSICAO_PONTOS.quadrilB.x} y2={POSICAO_PONTOS.quadrilB.y} />
                  <line x1={POSICAO_PONTOS.quadrilA.x} y1={POSICAO_PONTOS.quadrilA.y} x2={POSICAO_PONTOS.joelhoA.x} y2={POSICAO_PONTOS.joelhoA.y} />
                  <line x1={POSICAO_PONTOS.joelhoA.x} y1={POSICAO_PONTOS.joelhoA.y} x2={POSICAO_PONTOS.tornozeloA.x} y2={POSICAO_PONTOS.tornozeloA.y} />
                  <line x1={POSICAO_PONTOS.tornozeloA.x} y1={POSICAO_PONTOS.tornozeloA.y} x2={POSICAO_PONTOS.peA.x} y2={POSICAO_PONTOS.peA.y} />
                  <line x1={POSICAO_PONTOS.quadrilB.x} y1={POSICAO_PONTOS.quadrilB.y} x2={POSICAO_PONTOS.joelhoB.x} y2={POSICAO_PONTOS.joelhoB.y} />
                  <line x1={POSICAO_PONTOS.joelhoB.x} y1={POSICAO_PONTOS.joelhoB.y} x2={POSICAO_PONTOS.tornozeloB.x} y2={POSICAO_PONTOS.tornozeloB.y} />
                  <line x1={POSICAO_PONTOS.tornozeloB.x} y1={POSICAO_PONTOS.tornozeloB.y} x2={POSICAO_PONTOS.peB.x} y2={POSICAO_PONTOS.peB.y} />
                </g>
                <circle cx={POSICAO_PONTOS.cabeca.x} cy={POSICAO_PONTOS.cabeca.y} r="18" fill="#EDEDF0" stroke="#D2D2D7" strokeWidth="3" />

                {/* ponto de referência, se houver */}
                {rodadaAtual.ref && (
                  <g>
                    <circle cx={POSICAO_PONTOS[rodadaAtual.ref].x} cy={POSICAO_PONTOS[rodadaAtual.ref].y} r="10" fill="#F59E0B" stroke="#FFFFFF" strokeWidth="2" />
                    <text x={POSICAO_PONTOS[rodadaAtual.ref].x} y={POSICAO_PONTOS[rodadaAtual.ref].y - 15} textAnchor="middle" fontSize="10" fill="#B45309" fontWeight="700">REF</text>
                  </g>
                )}

                {/* opções tocáveis */}
                {rodadaAtual.opcoes.map((op) => {
                  const p = POSICAO_PONTOS[op.id];
                  const foiSelecionado = selecionado === op.id;
                  let fill = "#9CA3AF";
                  if (foiSelecionado) fill = op.correta ? "#22C55E" : "#EF4444";
                  return (
                    <circle
                      key={op.id}
                      cx={p.x}
                      cy={p.y}
                      r="14"
                      fill={fill}
                      stroke="#FFFFFF"
                      strokeWidth="2.5"
                      onClick={() => handleTap(op)}
                      style={{ cursor: "pointer" }}
                    />
                  );
                })}
              </svg>
            </div>
          </>
        )}

        {fase === "fim" && (
          <div className="rounded-2xl p-5 text-center" style={{ background: "#FFFFFF", border: "1px solid #E5E5EA" }}>
            <p className="text-xs font-semibold uppercase tracking-wide mb-1" style={{ color: "#22C55E" }}>Resultado</p>
            <p className="text-3xl font-bold mb-1" style={{ color: "#1D1D1F" }}>{pontuacao} / {rodadas.length}</p>
            <p className="text-sm mb-4" style={{ color: "#6E6E73" }}>
              {pontuacao === rodadas.length ? "Perfeito!" : pontuacao >= rodadas.length * 0.7 ? "Muito bom!" : "Vale revisar os termos e jogar de novo."}
            </p>
            <button onClick={iniciar} className="w-full py-2.5 rounded-full text-sm font-semibold" style={{ background: "#22C55E", color: "#FFFFFF" }}>
              Jogar de novo
            </button>
          </div>
        )}

        <ContactFooter />
      </div>
    </div>
  );
}

function dentroFaixa(v, faixa) {
  return v >= faixa[0] && v <= faixa[1];
}

function avaliarCaso(caso, resposta) {
  if (caso.contraindicado) {
    return resposta.declarouContraindicado === true;
  }
  if (resposta.declarouContraindicado) return false;
  const p = resposta.parametros;
  const e = caso.esperado;
  const paramsOk =
    dentroFaixa(p.frequencia, e.frequencia) &&
    dentroFaixa(p.duracaoPulso, e.duracaoPulso) &&
    dentroFaixa(p.intensidade, e.intensidade);
  const canaisOk = e.canais.includes(resposta.eletrodos.length);
  const zonaOk =
    resposta.eletrodos.length > 0 &&
    resposta.eletrodos.every((el) => e.zonas.includes(el.zonaId));

  let modulacaoOk;
  if (caso.modulacaoEsperada) {
    modulacaoOk =
      resposta.modulacaoAtiva &&
      resposta.ton > 0 &&
      resposta.toff > 0 &&
      dentroFaixa(resposta.rise, [1, 5]) &&
      dentroFaixa(resposta.decay, [1, 5]);
  } else {
    modulacaoOk = !resposta.modulacaoAtiva;
  }

  return paramsOk && canaisOk && zonaOk && modulacaoOk;
}

function SimuladorEletroterapiaClinico({ onBack }) {
  const { useState } = React;
  const [casoId, setCasoId] = useState(null);
  const [frequencia, setFrequencia] = useState(50);
  const [duracaoPulso, setDuracaoPulso] = useState(200);
  const [intensidade, setIntensidade] = useState(30);
  const [eletrodos, setEletrodos] = useState([]);
  const [modulacaoAtiva, setModulacaoAtiva] = useState(false);
  const [ton, setTon] = useState(5);
  const [toff, setToff] = useState(10);
  const [rise, setRise] = useState(2);
  const [decay, setDecay] = useState(1);
  const [resultado, setResultado] = useState(null); // null | "certo" | "errado"

  const caso = ELETRO_CASOS.find((c) => c.id === casoId);

  function iniciarCaso(id) {
    setCasoId(id);
    setFrequencia(50);
    setDuracaoPulso(200);
    setIntensidade(30);
    setEletrodos([]);
    setModulacaoAtiva(false);
    setTon(5);
    setToff(10);
    setRise(2);
    setDecay(1);
    setResultado(null);
  }

  function voltarMenu() {
    setCasoId(null);
    setResultado(null);
  }

  function handleCliqueCorpo(zonaId) {
    if (resultado) return;
    setEletrodos((prev) => {
      const jaTem = prev.find((e) => e.zonaId === zonaId);
      if (jaTem) return prev.filter((e) => e.zonaId !== zonaId);
      if (prev.length >= 2) return prev; // máximo 2 canais
      return [...prev, { zonaId }];
    });
  }

  function limparEletrodos() {
    setEletrodos([]);
  }

  function avaliar(declarouContraindicado) {
    const resposta = {
      declarouContraindicado,
      parametros: { frequencia, duracaoPulso, intensidade },
      eletrodos,
      modulacaoAtiva,
      ton,
      toff,
      rise,
      decay,
    };
    const acertou = avaliarCaso(caso, resposta);
    setResultado(acertou ? "certo" : "errado");
  }

  function tentarDeNovo() {
    setResultado(null);
  }

  return (
    <div className="min-h-screen w-full" style={{ background: "#F5F5F7" }}>
      <div
        className="px-5 pb-4 border-b flex items-center justify-between"
        style={{ borderColor: "#E5E5EA", background: "#FFFFFF", paddingTop: "calc(env(safe-area-inset-top) + 1.25rem)" }}
      >
        <div>
          <h1 className="text-xl font-bold" style={{ color: "#1D1D1F" }}>Simulador Clínico</h1>
          <p className="text-sm" style={{ color: "#6E6E73" }}>Eletroterapia</p>
        </div>
        {onBack && (
          <button
            onClick={onBack}
            className="text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap"
            style={{ background: "#F5F5F7", border: "1px solid #E5E5EA", color: "#6E6E73" }}
          >
            ← FisioLab
          </button>
        )}
      </div>

      <div className="p-4 max-w-md mx-auto">
        {!caso && (
          <>
            <p className="text-xs font-semibold uppercase tracking-wide mb-3" style={{ color: "#6E6E73" }}>
              Escolha um caso
            </p>
            <div className="space-y-3">
              {ELETRO_CASOS.map((c) => (
                <button
                  key={c.id}
                  onClick={() => iniciarCaso(c.id)}
                  className="w-full text-left rounded-2xl p-4"
                  style={{ background: "#FFFFFF", border: "1px solid #E5E5EA" }}
                >
                  <h3 className="text-sm font-semibold mb-1" style={{ color: "#1D1D1F" }}>{c.titulo}</h3>
                  <p className="text-xs leading-relaxed" style={{ color: "#6E6E73" }}>{c.card}</p>
                </button>
              ))}
            </div>
            <ContactFooter />
          </>
        )}

        {caso && (
          <>
            <button onClick={voltarMenu} className="text-xs font-medium mb-3" style={{ color: "#6E6E73" }}>
              ← Trocar de caso
            </button>

            <div className="rounded-2xl p-4 mb-4" style={{ background: "#1D1D1F" }}>
              <p className="text-xs font-semibold uppercase tracking-wide mb-1" style={{ color: "#22C55E" }}>{caso.titulo}</p>
              <p className="text-sm leading-relaxed" style={{ color: "#FFFFFF" }}>{caso.card}</p>
            </div>

            {resultado && (
              <div
                className="rounded-2xl p-4 mb-4 text-center"

                </button>

            {!resultado && (

                      <line x1="120" y1="235" x2="122" y2="305" />

                    </g>
                    <circle cx="100" cy="30" r="18" fill="#EDEDF0" stroke="#D2D2D7" strokeWidth="3" />

                    {Object.entries(ELETRO_ZONAS).map(([id, z]) => {
                      const selecionado = eletrodos.some((e) => e.zonaId === id);
                      return (
                        <circle
                          key={id}
                          cx={z.x}

    </div>
  );
}

/* =========================================================================
   DETETIVE ÓSSEO — o aluno sorteia uma pista (gerada a partir do banco de
   marcos ósseos acima) e escolhe entre 5 opções, contra o tempo. As opções
   erradas são sempre estruturas parecidas (mesmo osso, ou mesmo grupo
   anatômico), pra exigir raciocínio de verdade, não só reconhecimento.
   ========================================================================= */

function gerarPista(m) {
  const partes = [];
  if (m.regiao && m.regiao !== "—") partes.push("na região " + m.regiao.toLowerCase());
  if (m.face && m.face !== "—") partes.push("na face/localização " + m.face.toLowerCase());
  const localizacao = partes.length ? ", " + partes.join(", ") : "";
  return `Sou uma estrutura do(a) ${m.osso}${localizacao}. ${m.funcao}.`;
}

function embaralhar(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function gerarOpcoes(correta, banco) {
  const mesmoOsso = banco.filter((m) => m.id !== correta.id && m.osso === correta.osso && m.osso);
  const mesmoGrupo = banco.filter((m) => m.id !== correta.id && m.grupo === correta.grupo && m.osso !== correta.osso);
  const resto = banco.filter((m) => m.id !== correta.id && m.grupo !== correta.grupo && m.osso !== correta.osso);

  const candidatos = [...embaralhar(mesmoOsso), ...embaralhar(mesmoGrupo), ...embaralhar(resto)];
  const distratores = candidatos.slice(0, 4);
  return embaralhar([correta, ...distratores]);
}

function gerarRodadas(banco, quantidade) {
  const sorteados = embaralhar(banco).slice(0, quantidade);
  return sorteados.map((m) => ({
    correta: m,
    pista: gerarPista(m),
    opcoes: gerarOpcoes(m, banco),
  }));
}

const DETETIVE_DIFICULDADES = [
  { id: "facil", label: "Fácil", tempo: 40 },
  { id: "medio", label: "Médio", tempo: 30 },
  { id: "dificil", label: "Difícil", tempo: 20 },
  { id: "mestre", label: "Mestre da Anatomia", tempo: 10 },
];

const DETETIVE_GRUPOS = [...new Set(MARCOS_OSSEOS.map((m) => m.grupo))];

function DetetiveOsseo({ onBack }) {
  const { useState, useEffect, useRef } = React;

  const [fase, setFase] = useState("intro"); // "intro" | "jogando" | "fim"
  const [dificuldade, setDificuldade] = useState("dificil");
  const [numPerguntas, setNumPerguntas] = useState(12);
  const [gruposSelecionados, setGruposSelecionados] = useState(DETETIVE_GRUPOS);
  const [rodadas, setRodadas] = useState([]);
  const [indice, setIndice] = useState(0);
  const [tempo, setTempo] = useState(20);
  const [pontuacao, setPontuacao] = useState(0);
  const [selecionado, setSelecionado] = useState(null);
  const [travarToque, setTravarToque] = useState(false);
  const timerRef = useRef(null);

  const ROUND_TIME = DETETIVE_DIFICULDADES.find((d) => d.id === dificuldade).tempo;

  function toggleGrupo(g) {
    setGruposSelecionados((prev) =>
      prev.includes(g) ? prev.filter((x) => x !== g) : [...prev, g]
    );
  }

  function iniciar() {
    const banco = MARCOS_OSSEOS.filter((m) => gruposSelecionados.includes(m.grupo));
    const bancoFinal = banco.length > 0 ? banco : MARCOS_OSSEOS;
    setRodadas(gerarRodadas(bancoFinal, numPerguntas));
    setIndice(0);
    setPontuacao(0);
    setTempo(ROUND_TIME);
    setSelecionado(null);
    setTravarToque(false);
    setFase("jogando");
  }

  const rodadaAtual = rodadas[indice];

  useEffect(() => {
    if (fase !== "jogando") return;
    if (timerRef.current) clearInterval(timerRef.current);
    timerRef.current = setInterval(() => {
      setTempo((t) => {
        if (t <= 1) {
          clearInterval(timerRef.current);
          avancar(false, null);
          return 0;
        }
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
    // eslint-disable-next-line
  }, [fase, indice]);

  function avancar(acertou, marcoEscolhido) {
    setTravarToque(true);
    setSelecionado(marcoEscolhido);
    if (acertou) setPontuacao((p) => p + 1);
    setTimeout(() => {
      setSelecionado(null);
      setTravarToque(false);
      if (indice + 1 >= rodadas.length) {
        setFase("fim");
      } else {
        setIndice((i) => i + 1);
        setTempo(ROUND_TIME);
      }
    }, 900);
  }

  function escolher(opcao) {
    if (travarToque) return;
    if (timerRef.current) clearInterval(timerRef.current);
    avancar(opcao.id === rodadaAtual.correta.id, opcao.marco);
  }

  return (
    <div className="min-h-screen w-full" style={{ background: "#F5F5F7" }}>
      <div
        className="px-5 pb-4 border-b flex items-center justify-between"
        style={{ borderColor: "#E5E5EA", background: "#FFFFFF", paddingTop: "calc(env(safe-area-inset-top) + 1.25rem)" }}
      >
        <div>
          <h1 className="text-xl font-bold" style={{ color: "#1D1D1F" }}>Detetive Ósseo</h1>
          <p className="text-sm" style={{ color: "#6E6E73" }}>Anatomia Óssea</p>
        </div>
        {onBack && (
          <button
            onClick={onBack}
            className="text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap"
            style={{ background: "#F5F5F7", border: "1px solid #E5E5EA", color: "#6E6E73" }}
          >
            ← FisioLab
          </button>
        )}
      </div>

      <div className="p-4 max-w-md mx-auto">
        {fase === "intro" && (
          <div className="space-y-4">
            <div className="rounded-2xl p-4" style={{ background: "#FFFFFF", border: "1px solid #E5E5EA" }}>
              <p className="text-sm leading-relaxed" style={{ color: "#1D1D1F" }}>
                Leia a pista e descubra qual marco ósseo é. As opções erradas são sempre
                estruturas parecidas, então preste atenção nos detalhes.
              </p>
            </div>

            <div className="rounded-2xl p-4" style={{ background: "#FFFFFF", border: "1px solid #E5E5EA" }}>
              <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: "#22C55E" }}>Dificuldade</p>
              <div className="grid grid-cols-2 gap-2">
                {DETETIVE_DIFICULDADES.map((d) => (
                  <button
                    key={d.id}
                    onClick={() => setDificuldade(d.id)}
                    className="py-2 rounded-lg text-xs font-semibold leading-tight"
                    style={dificuldade === d.id ? { background: "#22C55E", color: "#FFFFFF" } : { background: "#F5F5F7", color: "#6E6E73", border: "1px solid #E5E5EA" }}
                  >
                    {d.label}
                    <br />
                    <span style={{ fontWeight: 400, opacity: 0.85 }}>{d.tempo}s</span>
                  </button>
                ))}
              </div>
            </div>

            <div className="rounded-2xl p-4" style={{ background: "#FFFFFF", border: "1px solid #E5E5EA" }}>
              <div className="flex items-center justify-between mb-1">
                <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: "#22C55E" }}>Número de perguntas</p>
                <span className="text-xs font-semibold px-2 py-0.5 rounded" style={{ background: "#EAFBF0", color: "#16A34A" }}>{numPerguntas}</span>
              </div>
              <input

            <div className="rounded-2xl p-4" style={{ background: "#FFFFFF", border: "1px solid #E5E5EA" }}>
              <div className="flex items-center justify-between mb-2">
                <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: "#22C55E" }}>Parte do corpo</p>
                <button
                  onClick={() => setGruposSelecionados(gruposSelecionados.length === DETETIVE_GRUPOS.length ? [] : DETETIVE_GRUPOS)}
                  className="text-xs font-medium"
                  style={{ color: "#6E6E73" }}
                >
                  {gruposSelecionados.length === DETETIVE_GRUPOS.length ? "Limpar" : "Selecionar todas"}
                </button>
              </div>
              <div className="space-y-1.5">
                {DETETIVE_GRUPOS.map((g) => (
                  <label key={g} className="flex items-center gap-2 text-sm" style={{ color: "#1D1D1F" }}>
                    <input type="checkbox" checked={gruposSelecionados.includes(g)} onChange={() => toggleGrupo(g)} />
                    {g}
                  </label>
                ))}
              </div>
              {gruposSelecionados.length === 0 && (
                <p className="text-xs mt-2" style={{ color: "#9A9AA0" }}>Nenhuma selecionada — o jogo usa o banco inteiro.</p>
              )}
            </div>

            <button onClick={iniciar} className="w-full py-2.5 rounded-full text-sm font-semibold" style={{ background: "#22C55E", color: "#FFFFFF" }}>
              Começar
            </button>
          </div>
        )}

        {fase === "jogando" && rodadaAtual && (
          <>
            <div className="flex items-center justify-between mb-3">
              <p className="text-xs font-semibold" style={{ color: "#6E6E73" }}>
                Rodada {indice + 1}/{rodadas.length} · Pontos: {pontuacao}
              </p>
              <span
                className="text-xs font-bold px-2.5 py-1 rounded-full"
                style={{ background: tempo <= 5 ? "#FEE2E2" : "#EAFBF0", color: tempo <= 5 ? "#DC2626" : "#16A34A" }}
              >
                {tempo}s
              </span>
            </div>

            <div className="rounded-2xl p-4 mb-4" style={{ background: "#1D1D1F" }}>
              <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: "#22C55E" }}>🔍 Pista</p>
              <p className="text-sm leading-relaxed" style={{ color: "#FFFFFF" }}>{rodadaAtual.pista}</p>
            </div>

            <div className="space-y-2">
              {rodadaAtual.opcoes.map((op) => {
                const foiSelecionado = selecionado === op.marco;
                const ehCorreta = op.id === rodadaAtual.correta.id;
                let estilo = { background: "#FFFFFF", border: "1px solid #E5E5EA", color: "#1D1D1F" };
                if (selecionado) {
                  if (ehCorreta) estilo = { background: "#EAFBF0", border: "1px solid #22C55E", color: "#15803D" };
                  else if (foiSelecionado) estilo = { background: "#FEE2E2", border: "1px solid #EF4444", color: "#DC2626" };
                }
                return (
                  <button
                    key={op.id}
                    onClick={() => escolher(op)}
                    disabled={travarToque}
                    className="w-full text-left rounded-xl px-4 py-3 text-sm font-medium"
                    style={estilo}
                  >
                    {op.marco}
                  </button>
                );
              })}
            </div>
          </>
        )}

        {fase === "fim" && (
          <div className="rounded-2xl p-5 text-center" style={{ background: "#FFFFFF", border: "1px solid #E5E5EA" }}>
            <p className="text-xs font-semibold uppercase tracking-wide mb-1" style={{ color: "#22C55E" }}>Resultado</p>
            <p className="text-3xl font-bold mb-1" style={{ color: "#1D1D1F" }}>{pontuacao} / {rodadas.length}</p>
            <p className="text-sm mb-4" style={{ color: "#6E6E73" }}>
              {pontuacao === rodadas.length ? "Detetive nível especialista!" : pontuacao >= rodadas.length * 0.7 ? "Muito bom!" : "Vale revisar os marcos e jogar de novo."}
            </p>
            <button onClick={iniciar} className="w-full py-2.5 rounded-full text-sm font-semibold" style={{ background: "#22C55E", color: "#FFFFFF" }}>
              Jogar de novo
            </button>
          </div>
        )}

        <ContactFooter />
      </div>
    </div>
  );
}

function logAcesso(user, tool) {
  if (!user) return;
  try {
    db.collection("acessos").add({
      userId: user.uid,
      userName: user.displayName || user.email || "(sem nome)",
      toolId: tool.id,
      toolTitle: tool.title,
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
    });
  } catch (e) {
    // falha silenciosa — não deve atrapalhar o uso do app
  }
}

function ToolCard({ tool, onSelect, user }) {
  const { useState } = React;
  const [showLock, setShowLock] = useState(false);
  const [pass, setPass] = useState("");
  const [passError, setPassError] = useState("");

  function handleClick() {
    if (tool.locked) {
      setShowLock(true);
    } else {
      logAcesso(user, tool);
      onSelect(tool.id);
    }
  }

  function tryUnlock() {
    if (pass === ADMIN_PASSCODE) {
      setShowLock(false);
      setPass("");
      setPassError("");
      logAcesso(user, tool);
      onSelect(tool.id);
    } else {
      setPassError("Senha incorreta.");
    }
  }

  return (
    <>
      <button
        onClick={handleClick}
        className="text-left rounded-2xl p-5 w-full transition-shadow hover:shadow-md relative"
        style={{ background: "#FFFFFF", border: "1px solid #E5E5EA" }}
      >
        {tool.locked && (
          <span
            className="absolute top-3 right-3 text-[10px] font-semibold px-2 py-0.5 rounded-full"
            style={{ background: "#FEF3C7", color: "#92400E" }}
          >
            Em breve
          </span>
        )}
        <p className="text-xs font-semibold uppercase tracking-wide mb-1" style={{ color: "#22C55E" }}>
          {tool.subtitle}
        </p>
        <h3 className="text-lg font-semibold mb-1" style={{ color: "#1D1D1F" }}>
          {tool.title}
        </h3>
        <p className="text-sm leading-relaxed" style={{ color: "#6E6E73" }}>
          {tool.description}
        </p>
      </button>

      {showLock && (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-5"
          style={{ background: "rgba(29,29,31,0.5)" }}
          onClick={() => { setShowLock(false); setPass(""); setPassError(""); }}
        >
          <div
            className="max-w-xs w-full rounded-2xl p-5"
            style={{ background: "#FFFFFF" }}
            onClick={(e) => e.stopPropagation()}
          >
            <p className="text-sm font-semibold mb-1" style={{ color: "#1D1D1F" }}>Em desenvolvimento</p>
            <p className="text-xs mb-3" style={{ color: "#6E6E73" }}>Essa ferramenta ainda está em testes. Digite a senha para acessar.</p>
            <input
              type="password"
              value={pass}
              onChange={(e) => setPass(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && tryUnlock()}
              className="w-full rounded-lg px-3 py-2 text-sm border outline-none mb-2"
              style={{ borderColor: "#E5E5EA" }}
              autoFocus
            />
            {passError && <p className="text-xs mb-2" style={{ color: "#EF4444" }}>{passError}</p>}
            <button onClick={tryUnlock} className="w-full py-2 rounded-full text-sm font-semibold" style={{ background: "#22C55E", color: "#FFFFFF" }}>
              Entrar
            </button>
          </div>
        </div>
      )}
    </>
  );
}

            <p className="text-xs mb-4" style={{ color: "#9A9AA0" }}>
              Depois disso, o ícone do FisioLab fica na sua tela inicial, igual a um aplicativo normal.
            </p>

            <button
              onClick={() => setShowInstall(false)}
              className="w-full text-center text-xs"
              style={{ color: "#9A9AA0" }}
            >
              Fechar
            </button>
          </div>
        </div>
      )}

      {showAbout && (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-5"
          style={{ background: "rgba(29,29,31,0.5)" }}
          onClick={() => setShowAbout(false)}
        >
          <div
            className="max-w-sm w-full rounded-2xl p-6"
            style={{ background: "#FFFFFF" }}
            onClick={(e) => e.stopPropagation()}
          >
            <p className="text-sm leading-relaxed mb-3" style={{ color: "#1D1D1F" }}>
              Olá! Eu sou o Prof. Felipe Cerqueira, fisioterapeuta, professor
              e diretor da OrtoFlix.
            </p>
            <p className="text-sm leading-relaxed mb-3" style={{ color: "#1D1D1F" }}>
              Criei o FisioLab para reunir ferramentas que ajudam no
              aprendizado da fisioterapia de forma prática e interativa. A
              ideia é oferecer recursos que eu gostaria que todos os meus
              alunos tivessem à disposição durante a graduação, mas que
              também podem ser úteis para professores e profissionais.
            </p>
            <p className="text-sm leading-relaxed mb-5" style={{ color: "#1D1D1F" }}>
              O FisioLab faz parte da OrtoFlix, uma plataforma que desenvolvi
              para compartilhar conhecimento em fisioterapia ortopédica. Se
              quiser conhecer um pouco mais sobre esse projeto, basta clicar
              abaixo.
            </p>
            <a
              href="https://ortoflix.com"
              target="_blank"
              rel="noopener noreferrer"
              className="block text-center text-sm font-semibold px-5 py-2.5 rounded-full mb-3"
              style={{ background: "#22C55E", color: "#FFFFFF" }}
            >
              Conhecer a OrtoFlix →
            </a>
            <button
              onClick={() => setShowAbout(false)}
              className="w-full text-center text-xs"
              style={{ color: "#9A9AA0" }}
            >
              Fechar
            </button>
          </div>
        </div>
      )}

      <div className="px-5 pb-6 max-w-2xl mx-auto">
        <p className="text-xs font-semibold uppercase tracking-wide mb-3" style={{ color: "#6E6E73" }}>
          Ferramentas
        </p>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          {ALL_TOOLS_SORTED.map((tool) =>
            tool.type === "external" ? (
              <ExternalToolCard key={tool.id} tool={tool} user={user} />
            ) : (
              <ToolCard key={tool.id} tool={tool} onSelect={onSelect} user={user} />
            )
          )}
          <OrtoFlixCard user={user} />
        </div>

        <div className="mt-8 rounded-2xl p-6 text-center" style={{ background: "#1D1D1F" }}>
          <img
            src="ortoflix-logo.png"
            alt="OrtoFlix"
            style={{ maxWidth: "170px", width: "50%", height: "auto", margin: "0 auto 16px" }}
          />
          <p className="text-sm leading-relaxed mb-4" style={{ color: "#A1A1A6" }}>
            O maior streaming de fisioterapia ortopédica do Brasil. Conteúdo
            em série para estudantes e profissionais.
          </p>
          <a
            href="https://ortoflix.com"
            target="_blank"
            rel="noopener noreferrer"
            className="inline-block text-sm font-semibold px-5 py-2.5 rounded-full"
            style={{ background: "#22C55E", color: "#FFFFFF" }}
          >
            Acessar OrtoFlix →
          </a>
        </div>

        <ContactFooter />
      </div>
    </div>
  );
}

function App({ user }) {
  const [selected, setSelected] = useState(null);
  const tool = TOOLS.find((t) => t.id === selected);

  if (!selected || !tool) {
    return <Home onSelect={setSelected} user={user} />;
  }

  const ToolComponent = tool.component;
  return <ToolComponent onBack={() => setSelected(null)} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
