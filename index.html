<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

/* =========================================================================
   FIREBASE — cadastro/login (liberação automática, sem confirmação por
   e-mail) e coleta de leads (nome, e-mail, perfil aluno/professor).
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyC29uyLP3YS-VMs8aFEwYe4qbgblGGP8eY",
  authDomain: "fisiolab-a4835.firebaseapp.com",
  projectId: "fisiolab-a4835",
  storageBucket: "fisiolab-a4835.firebasestorage.app",
  messagingSenderId: "395561821532",
  appId: "1:395561821532:web:6a33520680d6f2df830d99",
  measurementId: "G-VZLR1G737C",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function CadastroLogin() {
  const [modo, setModo] = useState("login"); // "cadastro" | "login"
  const [nome, setNome] = useState("");
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [perfil, setPerfil] = useState("aluno"); // "aluno" | "professor"
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  function traduzErro(e) {
    const code = e && e.code;
    const mapa = {
      "auth/email-already-in-use": "Esse e-mail já tem cadastro. Tente fazer login.",
      "auth/invalid-email": "E-mail inválido.",
      "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
      "auth/wrong-password": "Senha incorreta.",
      "auth/user-not-found": "Não encontramos cadastro com esse e-mail.",
      "auth/invalid-credential": "E-mail ou senha incorretos.",
      "auth/unauthorized-domain": "Este domínio ainda não está autorizado no Firebase (Authentication → Settings → Authorized domains).",
      "auth/operation-not-allowed": "Login por e-mail/senha não está habilitado no Firebase (Authentication → Sign-in method).",
      "permission-denied": "Sem permissão para salvar no banco de dados (verifique as regras do Firestore).",
    };
    if (mapa[code]) return mapa[code];
    return "Não foi possível concluir (" + (code || (e && e.message) || "erro desconhecido") + "). Tente novamente.";
  }

  async function handleCadastro() {
    setError("");
    if (!nome.trim() || !email.trim() || !senha) {
      setError("Preencha nome, e-mail e senha.");
      return;
    }
    setLoading(true);
    try {
      const cred = await auth.createUserWithEmailAndPassword(email.trim(), senha);
      await cred.user.updateProfile({ displayName: nome.trim() });
      await db.collection("usuarios").doc(cred.user.uid).set({
        nome: nome.trim(),
        email: email.trim(),
        perfil,
        criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
      });
      // já autenticado automaticamente — sem etapa de confirmação por e-mail
    } catch (e) {
      setError(traduzErro(e));
    } finally {
      setLoading(false);
    }
  }

  async function handleLogin() {
    setError("");
    if (!email.trim() || !senha) {
      setError("Preencha e-mail e senha.");
      return;
    }
    setLoading(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), senha);
    } catch (e) {
      setError(traduzErro(e));
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="min-h-screen w-full flex flex-col items-center justify-center p-5" style={{ background: "#F5F5F7" }}>
      <div className="max-w-sm w-full rounded-2xl p-6" style={{ background: "#FFFFFF", border: "1px solid #E5E5EA" }}>
        <div className="flex items-center justify-center gap-3 mb-2">
          <CubeIcon size={48} />
          <div className="text-left">
            <h1 className="text-3xl leading-none" style={{ color: "#1D1D1F", fontFamily: "'Poppins', sans-serif", fontWeight: 800 }}>
              Fisio<span style={{ color: "#22C55E" }}>Lab</span>
            </h1>
            <p className="text-xs mt-1" style={{ color: "#6E6E73" }}>
              by OrtoFlix — Ambiente de Estudo
            </p>
          </div>
        </div>
        <p className="text-xs text-center mb-4" style={{ color: "#9A9AA0" }}>
          Ambiente gratuito de estudo com simuladores, jogos e casos clínicos para alunos e professores de fisioterapia.
        </p>
        <p className="text-sm text-center mb-5" style={{ color: "#6E6E73" }}>
          {modo === "cadastro" ? "Crie sua conta para começar" : "Entre na sua conta"}
        </p>

        {modo === "cadastro" && (
          <div className="mb-3">
            <label className="text-xs font-medium block mb-1" style={{ color: "#6E6E73" }}>Nome</label>
            <input
              value={nome}
              onChange={(e) => setNome(e.target.value)}
              className="w-full rounded-lg px-3 py-2 text-sm border outline-none"
              style={{ borderColor: "#E5E5EA" }}
            />
          </div>
        )}

        <div className="mb-3">
          <label className="text-xs font-medium block mb-1" style={{ color: "#6E6E73" }}>E-mail</label>
          <input
            type="email"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            className="w-full rounded-lg px-3 py-2 text-sm border outline-none"
            style={{ borderColor: "#E5E5EA" }}
          />
        </div>

        <div className="mb-3">
          <label className="text-xs font-medium block mb-1" style={{ color: "#6E6E73" }}>Senha</label>
          <input
            type="password"
            value={senha}
            onChange={(e) => setSenha(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && (modo === "cadastro" ? handleCadastro() : handleLogin())}
            className="w-full rounded-lg px-3 py-2 text-sm border outline-none"
            style={{ borderColor: "#E5E5EA" }}
          />
        </div>

        {modo === "cadastro" && (
          <div className="mb-4">
            <label className="text-xs font-medium block mb-1" style={{ color: "#6E6E73" }}>Você é...</label>
            <div className="flex gap-2">
              <button
                onClick={() => setPerfil("aluno")}
                className="flex-1 py-2 rounded-lg text-sm font-medium"
                style={perfil === "aluno" ? { background: "#22C55E", color: "#FFFFFF" } : { background: "#F5F5F7", color: "#6E6E73", border: "1px solid #E5E5EA" }}
              >
                Estudante
              </button>
              <button
                onClick={() => setPerfil("professor")}
                className="flex-1 py-2 rounded-lg text-sm font-medium"
                style={perfil === "professor" ? { background: "#22C55E", color: "#FFFFFF" } : { background: "#F5F5F7", color: "#6E6E73", border: "1px solid #E5E5EA" }}
              >
                Professor
              </button>
            </div>
          </div>
        )}

        {error && <p className="text-xs mb-3" style={{ color: "#EF4444" }}>{error}</p>}

        <button
          onClick={modo === "cadastro" ? handleCadastro : handleLogin}
          disabled={loading}
          className="w-full py-2.5 rounded-full text-sm font-semibold disabled:opacity-50"
          style={{ background: "#22C55E", color: "#FFFFFF" }}
        >
          {loading ? "Aguarde..." : modo === "cadastro" ? "Criar conta" : "Entrar"}
        </button>

        <button
          onClick={() => { setModo(modo === "cadastro" ? "login" : "cadastro"); setError(""); }}
          className="w-full text-center text-xs mt-4"
          style={{ color: "#6E6E73" }}
        >
          {modo === "cadastro" ? "Já tem conta? Entrar" : "Não tem conta? Criar agora"}
        </button>
      </div>
      <div className="max-w-sm w-full">
        <ContactFooter />
      </div>
    </div>
  );
}

function AuthGate() {
  const [status, setStatus] = useState("loading"); // "loading" | "out" | "in"
  const [currentUser, setCurrentUser] = useState(null);

  useEffect(() => {
    const unsubscribe = auth.onAuthStateChanged((user) => {
      setCurrentUser(user);
      setStatus(user ? "in" : "out");
    });
    return unsubscribe;
  }, []);

  if (status === "loading") {
    return (
      <div className="min-h-screen w-full flex items-center justify-center" style={{ background: "#F5F5F7" }}>
        <p className="text-sm" style={{ color: "#6E6E73" }}>Carregando...</p>
      </div>
    );
  }

  if (status === "out") {
    return <CadastroLogin />;
  }

  return <App user={currentUser} />;
}


/* =========================================================================
   Design: painel de aparelho de eletroestimulação — tela tipo osciloscópio
   com traço fósforo verde, chassi escuro, leitura em LCD mono.

   Estrutura alinhada ao slide "Podem ser classificadas": tipo de corrente,
   polaridade (resultante — polarizada/despolarizada), número de fases e
   formato de onda são tratados como eixos que se combinam, não um menu único.
   ========================================================================= */

const TIPOS = [
  { id: "cc", label: "Corrente Contínua (CC)" },
  { id: "ca", label: "Corrente Alternada (CA)" },
  { id: "pulsada", label: "Corrente Pulsada" },
];

const FORMATOS = [
  { id: "quadrada", label: "Quadrada" },
  { id: "triangular", label: "Triangular" },
  { id: "sinusoidal", label: "Sinusoidal" },
  { id: "trapezoidal", label: "Trapezoidal" },
];

function clinicalNote(tipo, numFases, simetria) {
  if (tipo === "cc") return "Fluxo unidirecional constante. Base da iontoforese e de efeitos polares (atração/repulsão iônica sob os eletrodos). Sempre polarizada.";
  if (tipo === "ca") return "Corrente sinusoidal bidirecional, sem componente polar líquido. Sempre despolarizada — não gera efeitos químicos cumulativos sob os eletrodos.";
  if (tipo === "pulsada" && numFases === "mono") return "Pulsos unidirecionais, com período de repouso entre eles. Sempre polarizada — requer atenção à carga acumulada por fase.";
  if (tipo === "pulsada" && numFases === "bi" && simetria === "simetrica") return "Cada fase é espelho da outra — carga líquida zero, despolarizada. Minimiza risco de irritação cutânea. Comum em TENS convencional.";
  if (tipo === "pulsada" && numFases === "bi" && simetria === "assimetrica") return "Fases com amplitude/duração diferentes, mas carga balanceada (mesma área sob a curva) — despolarizada. Comum em NMES para contração muscular.";
  return "";
}

function polaridadeResultante(tipo, numFases) {
  if (tipo === "cc") return "polarizada";
  if (tipo === "ca") return "despolarizada";
  if (tipo === "pulsada" && numFases === "mono") return "polarizada";
  return "despolarizada";
}

function SimuladorCorrentes({ onBack }) {
  const [tipo, setTipo] = useState("pulsada");
  const [numFases, setNumFases] = useState("bi");
  const [simetria, setSimetria] = useState("simetrica");
  const [formato, setFormato] = useState("quadrada");
  const [polo, setPolo] = useState(1);

  const [frequency, setFrequency] = useState(50);
  const [pulseWidth, setPulseWidth] = useState(10);
  const [phase2Width, setPhase2Width] = useState(20);
  const [intensity, setIntensity] = useState(20);
  const [showInfo, setShowInfo] = useState(false);
  const [presentMode, setPresentMode] = useState(false);
  const [controlsOpen, setControlsOpen] = useState(false);

  const canvasRef = useRef(null);

  const WINDOW_MS = 1000;
  const MAX_MA = 100;

  const showFases = tipo === "pulsada";
  const showSimetria = tipo === "pulsada" && numFases === "bi";
  const showFormato = tipo === "pulsada";
  const showPolo = tipo === "cc";
  const showFrequency = tipo !== "cc";
  const showPulseWidth = tipo === "pulsada";
  const showPhase2 = tipo === "pulsada" && numFases === "bi" && simetria === "assimetrica";

  const polaridade = polaridadeResultante(tipo, numFases);

  function addPhase(pts, tStart, durationMs, amplitude, shape) {
    const push = (t, y) => pts.push({ t, y });
    if (durationMs <= 0) return;
    if (shape === "quadrada") {
      push(tStart, 0);
      push(tStart, amplitude);
      push(tStart + durationMs, amplitude);
      push(tStart + durationMs, 0);
    } else if (shape === "triangular") {
      push(tStart, 0);
      push(tStart + durationMs / 2, amplitude);
      push(tStart + durationMs, 0);
    } else if (shape === "trapezoidal") {
      const rise = durationMs * 0.25;
      push(tStart, 0);
      push(tStart + rise, amplitude);
      push(tStart + durationMs - rise, amplitude);
      push(tStart + durationMs, 0);
    } else if (shape === "sinusoidal") {
      const steps = 12;
      for (let i = 0; i <= steps; i++) {
        const t = tStart + (durationMs * i) / steps;
        const y = amplitude * Math.sin((Math.PI * i) / steps);
        push(t, y);
      }
    }
  }

  function buildPoints() {
    const pts = [];
    const push = (t, y) => pts.push({ t, y });

    if (tipo === "cc") {
      push(0, intensity * polo);
      push(WINDOW_MS, intensity * polo);
      return pts;
    }

    if (tipo === "ca") {
      const steps = 600;
      for (let i = 0; i <= steps; i++) {
        const t = (WINDOW_MS * i) / steps;
        const y = intensity * Math.sin((2 * Math.PI * frequency * t) / 1000);
        push(t, y);
      }
      return pts;
    }

    const period = 1000 / frequency;
    const pw1 = pulseWidth;
    const pw2 = phase2Width;
    const amp2 =
      numFases === "bi"
        ? simetria === "simetrica"
          ? intensity
          : (intensity * pulseWidth) / Math.max(phase2Width, 1)
        : 0;

    let t = 0;
    push(0, 0);
    while (t < WINDOW_MS) {
      addPhase(pts, t, pw1, intensity, formato);
      let cursor = t + pw1;
      if (numFases === "bi") {
        const dur2 = simetria === "simetrica" ? pw1 : pw2;
        addPhase(pts, cursor, dur2, -amp2, formato);
        cursor += dur2;
      }
      push(Math.min(cursor, WINDOW_MS), 0);
      t = Math.max(t + period, cursor);
      push(Math.min(t, WINDOW_MS), 0);
    }
    return pts;
  }

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;
    const padL = 58, padR = 16, padT = 16, padB = 28;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#07130D";
    ctx.fillRect(0, 0, W, H);

    const yZero = padT + plotH / 2;
    const xScale = plotW / WINDOW_MS;
    const yScale = (plotH / 2) / MAX_MA;

    ctx.strokeStyle = "rgba(74,255,140,0.14)";
    ctx.lineWidth = 1;
    const gridLinesX = 10;
    for (let i = 0; i <= gridLinesX; i++) {
      const x = padL + (plotW * i) / gridLinesX;
      ctx.beginPath();
      ctx.moveTo(x, padT);
      ctx.lineTo(x, padT + plotH);
      ctx.stroke();
    }
    const gridLinesY = 4;
    for (let i = 0; i <= gridLinesY; i++) {
      const y = padT + (plotH * i) / gridLinesY;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + plotW, y);
      ctx.stroke();
    }

    ctx.strokeStyle = "rgba(74,255,140,0.35)";
    ctx.beginPath();
    ctx.moveTo(padL, yZero);
    ctx.lineTo(padL + plotW, yZero);
    ctx.stroke();

    ctx.fillStyle = "#6FE3A3";
    ctx.font = "13px 'IBM Plex Mono', monospace";
    ctx.fillText(`+${MAX_MA} mA`, 4, padT + 8);
    ctx.fillText(`-${MAX_MA} mA`, 4, padT + plotH);
    ctx.fillText("0", 4, yZero + 3);
    ctx.fillText(`${WINDOW_MS} ms (1 s)`, padL + plotW - 62, padT + plotH + 18);
    ctx.fillText("0 ms", padL, padT + plotH + 18);

    const pts = buildPoints();
    ctx.strokeStyle = "#4AFF8C";
    ctx.lineWidth = 2;
    ctx.shadowColor = "#4AFF8C";
    ctx.shadowBlur = 6;
    ctx.beginPath();
    pts.forEach((p, i) => {
      const x = padL + p.t * xScale;
      const y = yZero - Math.max(-MAX_MA, Math.min(MAX_MA, p.y)) * yScale;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.shadowBlur = 0;
  }, [tipo, numFases, simetria, formato, polo, frequency, pulseWidth, phase2Width, intensity, presentMode]);

  return (
    <div className="min-h-screen w-full" style={{ background: "#12161B", fontFamily: "'IBM Plex Sans', sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        .font-display { font-family: 'Oswald', sans-serif; letter-spacing: 0.02em; }
        .font-mono { font-family: 'IBM Plex Mono', monospace; }
        input[type="range"] {
          -webkit-appearance: none;
          height: 4px;
          border-radius: 2px;
          background: #3A4650;
        }
        input[type="range"]::-webkit-slider-thumb {
          -webkit-appearance: none;
          width: 16px; height: 16px; border-radius: 50%;
          background: #E8892C; border: 2px solid #FFDCB0; cursor: pointer;
          margin-top: -6px;
        }
        input[type="range"]::-moz-range-thumb {
          width: 16px; height: 16px; border-radius: 50%;
          background: #E8892C; border: 2px solid #FFDCB0; cursor: pointer;
        }
      `}</style>

      {!presentMode && (
        <div className="px-5 pb-4 border-b flex items-center justify-between" style={{ borderColor: "#262D35", background: "#171B21", paddingTop: "calc(env(safe-area-inset-top) + 1.25rem)" }}>
          <div>
            <h1 className="font-display text-2xl" style={{ color: "#F2EFE6" }}>
              SIMULADOR DE CORRENTES
            </h1>
            <p className="font-mono text-xs tracking-widest uppercase" style={{ color: "#E8892C" }}>
              by OrtoFlix
            </p>
          </div>
          {onBack && (
            <button
              onClick={onBack}
              className="font-mono text-xs px-3 py-1.5 rounded border whitespace-nowrap"
              style={{ color: "#8A94A0", borderColor: "#3A4650", background: "#0F1318" }}
            >
              ← FisioLab
            </button>
          )}
        </div>
      )}

      <div className={presentMode ? "p-3 flex flex-col gap-3" : "p-4 md:p-6 grid grid-cols-1 lg:grid-cols-[1fr_380px] gap-5 max-w-6xl mx-auto"}>
        <div className="rounded-lg p-3 md:p-4 sticky top-2 z-10 relative" style={{ background: "#171B21", border: "1px solid #262D35" }}>
          <button
            onClick={() => { setPresentMode((v) => !v); setControlsOpen(false); }}
            aria-label={presentMode ? "Sair do modo apresentação" : "Modo apresentação"}
            title={presentMode ? "Sair do modo apresentação" : "Modo apresentação"}
            className="absolute top-3 right-3 z-20 w-8 h-8 rounded flex items-center justify-center border"
            style={{ color: "#E8892C", borderColor: "#3A4650", background: "#0F1318" }}
          >
            {presentMode ? (
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4M15 21h4a2 2 0 0 0 2-2v-4" />
              </svg>
            ) : (
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M3 9V5a2 2 0 0 1 2-2h4M17 3h4a2 2 0 0 1 2 2v4M21 15v4a2 2 0 0 1-2 2h-4M7 21H3a2 2 0 0 1-2-2v-4" />
              </svg>
            )}
          </button>
          <div className="flex items-center justify-between mb-2 flex-wrap gap-2 pr-10">
            <p className="font-mono text-xs uppercase tracking-widest" style={{ color: "#6FE3A3" }}>
              Forma de onda
            </p>
            <p className="font-mono text-xs text-right" style={{ color: "#6FE3A3" }}>
              {TIPOS.find((t) => t.id === tipo)?.label}
              {showFases && (numFases === "mono" ? " · Monofásica" : ` · Bifásica ${simetria === "simetrica" ? "simétrica" : "assimétrica"}`)}
              {showFormato && ` · ${FORMATOS.find((f) => f.id === formato)?.label}`}
            </p>
          </div>
          <canvas
            ref={canvasRef}
            width={presentMode ? 1400 : 900}
            height={presentMode ? 560 : 360}
            className="w-full rounded"

                <button
                  onClick={() => setPolo(-1)}

            </div>
          )}

          {showFrequency && (
            <Slider label="Frequência" value={frequency} unit="Hz" min={1} max={150} step={1} onChange={setFrequency} />
          )}

          {showPhase2 && (
            <Slider label="Duração da fase 2" value={phase2Width} unit="ms" min={pulseWidth} max={150} step={1} onChange={setPhase2Width} />
          )}
          <Slider label="Intensidade" value={intensity} unit="mA" min={1} max={100} step={1} onChange={setIntensity} />

          <div className="pt-2 mt-2" style={{ borderTop: "1px solid #262D35" }}>
            <p className="text-xs leading-relaxed" style={{ color: "#6C7680" }}>
              Simulação didática — os valores de corrente são ilustrativos, não
              correspondem à saída real de um equipamento clínico. Janela fixa de 1
              segundo e escala de amplitude fixa em ±100 mA, para facilitar a
              comparação visual entre parâmetros. A duração de pulso é exibida em
              milissegundos (em vez de microssegundos, como em equipamentos reais)
              para facilitar a visualização didática do formato da onda.
            </p>
          </div>
        </div>
        )}

        {presentMode && (
          <button
            onClick={() => setControlsOpen((v) => !v)}
            className="fixed bottom-5 right-5 z-20 font-mono text-xs px-4 py-2.5 rounded-full border shadow-lg"
            style={{ background: "#E8892C", color: "#171B21", borderColor: "#E8892C" }}
          >
            {controlsOpen ? "Fechar controles" : "Controles"}
          </button>
        )}
      </div>

      {!presentMode && <ContactFooter dark />}
    </div>
  );
}

function Slider({ label, value, unit, min, max, step, onChange }) {
  return (
    <div>
      <div className="flex items-center justify-between mb-1">
        <label className="font-mono text-xs uppercase tracking-widest" style={{ color: "#8A94A0" }}>{label}</label>
        <span className="font-mono text-sm px-2 py-0.5 rounded" style={{ background: "#0F1318", color: "#E8892C", border: "1px solid #3A4650" }}>
          {value} {unit}
        </span>
      </div>
      <input
        type="range"
        min={min}
        max={max}
        step={step}
        value={value}
        onChange={(e) => onChange(Number(e.target.value))}
        className="w-full"
      />
    </div>
  );
}


/* =========================================================================
   PALAVRAS CRUZADAS — motor de geração + interface de jogo.
   Para criar um novo banco de palavras, monte um array de
   { answer, clue } e chame generateCrossword(words) — o layout é
   calculado automaticamente (posições, interseções, numeração).
   ========================================================================= */

function normalizeAnswer(word) {
  return word
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function generateCrossword(rawWords) {
  const words = rawWords
    .map((w) => ({ ...w, answer: normalizeAnswer(w.answer) }))
    .sort((a, b) => b.answer.length - a.answer.length);

  const cells = new Map();
  const placements = [];

  function canPlace(word, x, y, dir) {
    let intersections = 0;
    for (let i = 0; i < word.length; i++) {
      const cx = dir === "H" ? x + i : x;
      const cy = dir === "V" ? y + i : y;
      const key = `${cx},${cy}`;
      const existing = cells.get(key);
      if (existing) {
        if (existing !== word[i]) return null;
        intersections++;
      } else {
        if (dir === "H") {
          if (cells.has(`${cx},${cy - 1}`) || cells.has(`${cx},${cy + 1}`)) return null;
        } else {
          if (cells.has(`${cx - 1},${cy}`) || cells.has(`${cx + 1},${cy}`)) return null;
        }
      }
    }
    const beforeX = dir === "H" ? x - 1 : x;
    const beforeY = dir === "V" ? y - 1 : y;
    const afterX = dir === "H" ? x + word.length : x;
    const afterY = dir === "V" ? y + word.length : y;
    if (cells.has(`${beforeX},${beforeY}`) || cells.has(`${afterX},${afterY}`)) return null;
    return intersections;
  }

  function place(word, x, y, dir) {
    for (let i = 0; i < word.length; i++) {
      const cx = dir === "H" ? x + i : x;
      const cy = dir === "V" ? y + i : y;
      cells.set(`${cx},${cy}`, word[i]);
    }
  }

  function tryPlaceAgainstExisting(w) {
    let best = null;
    for (const placed of placements) {
      for (let i = 0; i < w.answer.length; i++) {
        for (let j = 0; j < placed.answer.length; j++) {
          if (w.answer[i] !== placed.answer[j]) continue;
          const newDir = placed.dir === "H" ? "V" : "H";
          let x, y;
          if (placed.dir === "H") {
            x = placed.x + j;
            y = placed.y - i;
          } else {
            x = placed.x - i;
            y = placed.y + j;
          }
          const score = canPlace(w.answer, x, y, newDir);
          if (score !== null && score > 0) {
            if (!best || score > best.score) best = { x, y, dir: newDir, score };
          }
        }
      }
    }
    return best;
  }

  place(words[0].answer, 0, 0, "H");
  placements.push({ ...words[0], x: 0, y: 0, dir: "H" });

  for (let idx = 1; idx < words.length; idx++) {
    const best = tryPlaceAgainstExisting(words[idx]);
    if (best) {
      place(words[idx].answer, best.x, best.y, best.dir);
      placements.push({ ...words[idx], x: best.x, y: best.y, dir: best.dir });
    }
  }
  const placedAnswers = new Set(placements.map((p) => p.answer));
  for (const w of words.filter((w) => !placedAnswers.has(w.answer))) {
    const best = tryPlaceAgainstExisting(w);
    if (best) {
      place(w.answer, best.x, best.y, best.dir);
      placements.push({ ...w, x: best.x, y: best.y, dir: best.dir });
    }
  }

  let minX = 0, minY = 0, maxX = 0, maxY = 0;
  for (const p of placements) {
    const endX = p.dir === "H" ? p.x + p.answer.length - 1 : p.x;
    const endY = p.dir === "V" ? p.y + p.answer.length - 1 : p.y;
    minX = Math.min(minX, p.x, endX);
    minY = Math.min(minY, p.y, endY);
    maxX = Math.max(maxX, p.x, endX);
    maxY = Math.max(maxY, p.y, endY);
  }
  const normalized = placements.map((p) => ({ ...p, x: p.x - minX, y: p.y - minY }));
  const width = maxX - minX + 1;
  const height = maxY - minY + 1;

  // numeração: ordena os pontos de início em ordem de leitura (linha, depois coluna)
  const starts = [...normalized].sort((a, b) => (a.y - b.y) || (a.x - b.x));
  const numberByCoord = new Map();
  let n = 0;
  for (const p of starts) {
    const key = `${p.x},${p.y}`;
    if (!numberByCoord.has(key)) {
      n++;
      numberByCoord.set(key, n);
    }
  }
  const numbered = normalized.map((p) => ({ ...p, number: numberByCoord.get(`${p.x},${p.y}`) }));

  return { placements: numbered, width, height };
}

const KINESIO_WORDS = [
  { answer: "ALAVANCA", clue: "Sistema mecânico formado por uma barra rígida que gira em torno de um ponto fixo." },
  { answer: "TORQUE", clue: "Medida da força de rotação em torno de um eixo; também chamado de momento de força." },
  { answer: "FULCRO", clue: "Ponto de apoio ou eixo de rotação de uma alavanca." },
  { answer: "AGONISTA", clue: "Músculo principal responsável por produzir um movimento específico." },
  { answer: "ANTAGONISTA", clue: "Músculo que se opõe à ação do motor primário." },
  { answer: "SINERGISTA", clue: "Músculo que auxilia o agonista a realizar o movimento com eficiência." },
  { answer: "ISOMETRICA", clue: "Tipo de contração muscular em que o comprimento do músculo não se altera." },
  { answer: "CONCENTRICA", clue: "Tipo de contração em que o músculo se encurta durante a produção de força." },
  { answer: "EXCENTRICA", clue: "Tipo de contração em que o músculo se alonga enquanto produz força." },
  { answer: "GONIOMETRO", clue: "Instrumento utilizado para medir a amplitude de movimento articular." },
  { answer: "SAGITAL", clue: "Plano que divide o corpo em lados direito e esquerdo." },
  { answer: "TRANSVERSO", clue: "Plano que divide o corpo em partes superior e inferior." },
  { answer: "CINETICA", clue: "Ramo da biomecânica que estuda as forças que causam o movimento." },
  { answer: "CINEMATICA", clue: "Ramo da biomecânica que descreve o movimento sem considerar suas causas." },
];

function PalavrasCruzadas({ onBack }) {
  const { useState, useMemo, useRef } = React;
  const puzzle = useMemo(() => generateCrossword(KINESIO_WORDS), []);
  const [values, setValues] = useState({});
  const [checked, setChecked] = useState(false);
  const inputRefs = useRef({});

  const solutionByCell = useMemo(() => {
    const map = new Map();
    for (const p of puzzle.placements) {
      for (let i = 0; i < p.answer.length; i++) {
        const x = p.dir === "H" ? p.x + i : p.x;
        const y = p.dir === "V" ? p.y + i : p.y;
        map.set(`${x},${y}`, p.answer[i]);
      }
    }
    return map;
  }, [puzzle]);

  const startNumberByCell = useMemo(() => {
    const map = new Map();
    for (const p of puzzle.placements) {
      map.set(`${p.x},${p.y}`, p.number);
    }
    return map;
  }, [puzzle]);

  const uniqueCells = useMemo(() => {
    const list = [...solutionByCell.keys()].map((key) => {
      const [x, y] = key.split(",").map(Number);
      return { key, x, y };
    });
    list.sort((a, b) => a.y - b.y || a.x - b.x);
    return list;
  }, [solutionByCell]);

  const cellOrder = useMemo(() => {
    // ordem de tabulação: por palavra, na ordem de leitura (sem repetir interseções)
    const ordered = [];
    const seen = new Set();
    const sorted = [...puzzle.placements].sort((a, b) => a.number - b.number || (a.dir === "H" ? -1 : 1));
    for (const p of sorted) {
      for (let i = 0; i < p.answer.length; i++) {
        const x = p.dir === "H" ? p.x + i : p.x;
        const y = p.dir === "V" ? p.y + i : p.y;
        const key = `${x},${y}`;
        if (!seen.has(key)) {
          seen.add(key);
          ordered.push(key);
        }
      }
    }
    return ordered;
  }, [puzzle]);

  function handleChange(key, raw) {
    const letter = normalizeAnswer(raw).slice(-1);
    setValues((v) => ({ ...v, [key]: letter }));
    setChecked(false);
    if (letter) {
      const idx = cellOrder.indexOf(key);
      const next = cellOrder[idx + 1];
      if (next && inputRefs.current[next]) inputRefs.current[next].focus();
    }
  }

  function handleKeyDown(key, e) {
    if (e.key === "Backspace" && !values[key]) {
      const idx = cellOrder.indexOf(key);
      const prev = cellOrder[idx - 1];
      if (prev && inputRefs.current[prev]) inputRefs.current[prev].focus();
    }
  }

  function verificar() {
    setChecked(true);
  }

  function limpar() {
    setValues({});
    setChecked(false);
  }

  const totalCells = solutionByCell.size;
  const correctCells = [...solutionByCell.entries()].filter(([k, letter]) => values[k] === letter).length;
  const completo = checked && correctCells === totalCells;

  const cellSize = 30;

  const horizontais = puzzle.placements.filter((p) => p.dir === "H").sort((a, b) => a.number - b.number);
  const verticais = puzzle.placements.filter((p) => p.dir === "V").sort((a, b) => a.number - b.number);

  return (
    <div
      className="min-h-screen w-full"
      style={{
        background: "#F5F5F7",
        userSelect: "none",
        WebkitUserSelect: "none",
        MozUserSelect: "none",
        msUserSelect: "none",
        WebkitTouchCallout: "none",
      }}
      onCopy={(e) => e.preventDefault()}
      onCut={(e) => e.preventDefault()}
      onContextMenu={(e) => e.preventDefault()}
    >
      <div
        className="px-5 pb-4 border-b flex items-center justify-between"
        style={{ borderColor: "#E5E5EA", background: "#FFFFFF", paddingTop: "calc(env(safe-area-inset-top) + 1.25rem)" }}
      >
        <div>
          <h1 className="text-xl font-bold" style={{ color: "#1D1D1F" }}>Palavras Cruzadas</h1>
          <p className="text-sm" style={{ color: "#6E6E73" }}>Cinesiologia e Biomecânica</p>
        </div>
        {onBack && (
          <button
            onClick={onBack}
            className="text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap"
            style={{ background: "#F5F5F7", border: "1px solid #E5E5EA", color: "#6E6E73" }}
          >
            ← FisioLab
          </button>
        )}
      </div>

      <div className="p-4 max-w-3xl mx-auto">
        <div className="overflow-x-auto pb-2">
          <div
            style={{
              position: "relative",
              width: puzzle.width * cellSize,
              height: puzzle.height * cellSize,
              margin: "0 auto",
            }}
          >
            {uniqueCells.map(({ key, x, y }) => {
              const startNumber = startNumberByCell.get(key) || null;
              const value = values[key] || "";
              const solution = solutionByCell.get(key);
              const isCorrect = checked && value === solution;
              const isWrong = checked && value && value !== solution;
              return (
                <div
                  key={key}
                  style={{
                    position: "absolute",
                    left: x * cellSize,
                    top: y * cellSize,
                    width: cellSize,
                    height: cellSize,
                  }}
                >
                  {startNumber && (
                    <span
                      style={{
                        position: "absolute",
                        top: 1,
                        left: 2,
                        fontSize: 8,
                        color: "#9A9AA0",
                        zIndex: 2,
                        pointerEvents: "none",
                      }}
                    >
                      {startNumber}
                    </span>
                  )}
                  <input
                    ref={(el) => (inputRefs.current[key] = el)}
                    value={value}
                    onChange={(e) => handleChange(key, e.target.value)}
                    onKeyDown={(e) => handleKeyDown(key, e)}
                    maxLength={1}
                    className="text-center font-semibold"
                    style={{
                      width: "100%",
                      height: "100%",
                      border: `1px solid ${isCorrect ? "#22C55E" : isWrong ? "#EF4444" : "#D2D2D7"}`,
                      background: isCorrect ? "#DCFCE7" : isWrong ? "#FEE2E2" : "#FFFFFF",
                      color: "#1D1D1F",
                      fontSize: 14,
                      outline: "none",
                      padding: 0,
                    }}
                  />
                </div>
              );
            })}
          </div>
        </div>

        <div className="flex gap-2 justify-center my-4">
          <button
            onClick={verificar}
            className="text-sm font-semibold px-5 py-2.5 rounded-full"
            style={{ background: "#22C55E", color: "#FFFFFF" }}
          >
            Verificar
          </button>
          <button
            onClick={limpar}
            className="text-sm font-medium px-5 py-2.5 rounded-full"
            style={{ background: "#FFFFFF", border: "1px solid #E5E5EA", color: "#6E6E73" }}
          >
            Limpar
          </button>
        </div>

        {checked && (
          <p className="text-center text-sm mb-4" style={{ color: completo ? "#22C55E" : "#6E6E73" }}>
            {completo ? "🎉 Completo! Todas as respostas corretas." : `${correctCells} de ${totalCells} letras corretas.`}
          </p>
        )}

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div className="rounded-2xl p-4" style={{ background: "#FFFFFF", border: "1px solid #E5E5EA" }}>
            <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: "#22C55E" }}>Horizontais</p>
            {horizontais.map((p) => (
              <p key={p.number + "H"} className="text-sm mb-2" style={{ color: "#1D1D1F" }}>
                <strong>{p.number}.</strong> {p.clue}
              </p>
            ))}
          </div>

/* =========================================================================
   SUPER TRUNFO — RECURSOS FÍSICOS
   Baralho único e fixo. Sem sincronização entre aparelhos: cada aluno
   embaralha e revela cartas no próprio celular, compara o atributo
   escolhido em voz alta com o colega, e decidem juntos quem "leva" a
   rodada — igual ao baralho físico.
   ========================================================================= */

const TRUNFO_ATRIBUTOS = [
  { key: "analgesia", label: "Analgesia" },
  { key: "antiInflamatorio", label: "Anti-inflamatório" },
  { key: "efeitoFratura", label: "Efeito em fratura" },

const TRUNFO_CARTAS = [
  { nome: "TENS", analgesia: 10, antiInflamatorio: 2, efeitoFratura: 1, respostaMuscular: 5, parametros: 7, seguranca: 9 },
  { nome: "Corrente Russa", analgesia: 3, antiInflamatorio: 2, efeitoFratura: 1, respostaMuscular: 9, parametros: 7, seguranca: 6 },
  { nome: "Interferencial", analgesia: 8, antiInflamatorio: 4, efeitoFratura: 1, respostaMuscular: 5, parametros: 8, seguranca: 8 },

  { nome: "Laser (Fototerapia)", analgesia: 7, antiInflamatorio: 10, efeitoFratura: 5, respostaMuscular: 3, parametros: 6, seguranca: 8 },

];

function shuffleDeck(deck) {
  const arr = [...deck];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function SuperTrunfo({ onBack }) {
  const { useState, useMemo } = React;
  const [order, setOrder] = useState(() => shuffleDeck(TRUNFO_CARTAS));
  const [index, setIndex] = useState(0);
  const [rodada, setRodada] = useState(1);
  const [showHelp, setShowHelp] = useState(false);

  const carta = order[index];

  function proximaCarta() {
    if (index + 1 >= order.length) {
      setOrder(shuffleDeck(TRUNFO_CARTAS));
      setIndex(0);
    } else {
      setIndex(index + 1);
    }
    setRodada((r) => r + 1);
  }

  function embaralharDeNovo() {
    setOrder(shuffleDeck(TRUNFO_CARTAS));
    setIndex(0);
    setRodada(1);
  }

  const maxByAttr = useMemo(() => {
    const map = {};
    for (const attr of TRUNFO_ATRIBUTOS) {
      map[attr.key] = Math.max(...TRUNFO_CARTAS.map((c) => c[attr.key]));
    }
    return map;
  }, []);

  return (
    <div className="min-h-screen w-full" style={{ background: "#F5F5F7" }}>
      <div
        className="px-5 pb-4 border-b flex items-center justify-between"
        style={{ borderColor: "#E5E5EA", background: "#FFFFFF", paddingTop: "calc(env(safe-area-inset-top) + 1.25rem)" }}
      >
        <div>
          <h1 className="text-xl font-bold" style={{ color: "#1D1D1F" }}>Super Trunfo</h1>
          <p className="text-sm" style={{ color: "#6E6E73" }}>Recursos Físicos</p>
        </div>
        {onBack && (
          <button
            onClick={onBack}
            className="text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap"
            style={{ background: "#F5F5F7", border: "1px solid #E5E5EA", color: "#6E6E73" }}
          >
            ← FisioLab
          </button>
        )}
      </div>

      <div className="p-4 max-w-md mx-auto">
        <button
          onClick={() => setShowHelp((v) => !v)}
          className="w-full text-left text-sm font-medium mb-4 px-4 py-3 rounded-2xl"
          style={{ background: "#FFFFFF", border: "1px solid #E5E5EA", color: "#1D1D1F" }}
        >
          {showHelp ? "▾" : "▸"} Como jogar (em dupla, cada um com seu celular)
        </button>
        {showHelp && (
          <div className="text-sm leading-relaxed mb-4 px-4" style={{ color: "#6E6E73" }}>
            <p className="mb-2">1. Cada jogador abre esse jogo no próprio celular.</p>
            <p className="mb-2">2. Cada um toca em "Próxima carta" e vê sua carta atual.</p>
            <p className="mb-2">3. Quem começa escolhe um atributo (ex.: Analgesia) e fala o valor da sua carta em voz alta.</p>
            <p className="mb-2">4. O colega fala o valor da carta dele no mesmo atributo. Quem tiver o maior número vence a rodada.</p>
            <p>5. Toquem em "Próxima carta" e repitam — não precisa registrar placar, o jogo é sobre discutir por que cada recurso ganha ou perde em cada critério.</p>
          </div>
        )}

        <p className="text-center text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: "#9A9AA0" }}>
          Rodada {rodada}
        </p>

        <div className="rounded-3xl p-6 mb-4" style={{ background: "#1D1D1F" }}>
          <p className="text-xs font-semibold uppercase tracking-wide mb-1" style={{ color: "#22C55E" }}>
            Recurso físico
          </p>
          <h2 className="text-2xl font-bold mb-5" style={{ color: "#FFFFFF" }}>{carta.nome}</h2>

          <div className="space-y-3">
            {TRUNFO_ATRIBUTOS.map((attr) => {
              const value = carta[attr.key];
              const isTop = value === maxByAttr[attr.key];
              return (
                <div key={attr.key}>
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-sm" style={{ color: "#D1D1D6" }}>{attr.label}</span>
                    <span
                      className="text-sm font-bold px-2 py-0.5 rounded"
                      style={{ color: isTop ? "#1D1D1F" : "#FFFFFF", background: isTop ? "#22C55E" : "#3A3A3D" }}
                    >
                      {value}
                    </span>
                  </div>
                  <div className="w-full h-1.5 rounded-full" style={{ background: "#3A3A3D" }}>
                    <div
                      className="h-1.5 rounded-full"
                      style={{ width: `${value * 10}%`, background: isTop ? "#22C55E" : "#6E6E73" }}
                    />
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <div className="flex gap-2 justify-center mb-6">
          <button
            onClick={proximaCarta}
            className="text-sm font-semibold px-6 py-3 rounded-full"
            style={{ background: "#22C55E", color: "#FFFFFF" }}
          >
            Próxima carta
          </button>
          <button
            onClick={embaralharDeNovo}
            className="text-sm font-medium px-5 py-3 rounded-full"
            style={{ background: "#FFFFFF", border: "1px solid #E5E5EA", color: "#6E6E73" }}
          >
            Embaralhar
          </button>
        </div>

        <ContactFooter />
      </div>
    </div>
  );
}

const ADMIN_PASSCODE = "231087";

function AdminPanel({ onClose }) {
  const [unlocked, setUnlocked] = useState(false);
  const [passcodeInput, setPasscodeInput] = useState("");
  const [passError, setPassError] = useState("");
  const [loading, setLoading] = useState(false);
  const [loadError, setLoadError] = useState("");
  const [usuarios, setUsuarios] = useState([]);
  const [acessos, setAcessos] = useState([]);

  function tryUnlock() {
    if (passcodeInput === ADMIN_PASSCODE) {
      setUnlocked(true);
      setPassError("");
      carregarDados();
    } else {
      setPassError("Senha incorreta.");
    }
  }

  async function carregarDados() {
    setLoading(true);
    setLoadError("");
    try {
      const [usuariosSnap, acessosSnap] = await Promise.all([
        db.collection("usuarios").get(),
        db.collection("acessos").get(),
      ]);
      setUsuarios(usuariosSnap.docs.map((d) => ({ id: d.id, ...d.data() })));
      setAcessos(acessosSnap.docs.map((d) => ({ id: d.id, ...d.data() })));
    } catch (e) {
      setLoadError("Não foi possível carregar os dados (" + (e.code || e.message) + ").");
    } finally {
      setLoading(false);
    }
  }

  const totalAlunos = usuarios.filter((u) => u.perfil === "aluno").length;
  const totalProfessores = usuarios.filter((u) => u.perfil === "professor").length;

  const cliquesPorFerramenta = {};
  for (const a of acessos) {
    const key = a.toolTitle || a.toolId || "desconhecido";
    cliquesPorFerramenta[key] = (cliquesPorFerramenta[key] || 0) + 1;
  }
  const ferramentasOrdenadas = Object.entries(cliquesPorFerramenta).sort((a, b) => b[1] - a[1]);

  const porAluno = {};
  for (const a of acessos) {
    const nome = a.userName || a.userId || "desconhecido";
    if (!porAluno[nome]) porAluno[nome] = {};
    const key = a.toolTitle || a.toolId || "desconhecido";
    porAluno[nome][key] = (porAluno[nome][key] || 0) + 1;
  }
  const alunosOrdenados = Object.entries(porAluno).sort((a, b) => {
    const totalA = Object.values(a[1]).reduce((s, n) => s + n, 0);
    const totalB = Object.values(b[1]).reduce((s, n) => s + n, 0);
    return totalB - totalA;
  });

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(29,29,31,0.6)" }}>
      <div className="max-w-lg w-full max-h-[85vh] rounded-2xl flex flex-col" style={{ background: "#FFFFFF" }}>
        <div className="flex items-center justify-between px-5 pt-5 pb-3">
          <h3 className="text-lg font-semibold" style={{ color: "#1D1D1F" }}>Painel administrativo</h3>
          <button onClick={onClose} className="text-sm px-3 py-1.5 rounded-full" style={{ color: "#1D1D1F", background: "#F5F5F7", border: "1px solid #E5E5EA" }}>
            Fechar
          </button>
        </div>
        <div className="overflow-y-auto px-5 pb-5">

        {!unlocked ? (
          <>
            <p className="text-sm mb-2" style={{ color: "#6E6E73" }}>Senha de acesso</p>
            <input
              type="password"
              value={passcodeInput}
              onChange={(e) => setPasscodeInput(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && tryUnlock()}
              className="w-full rounded-lg px-3 py-2 text-sm border outline-none mb-3"
              style={{ borderColor: "#E5E5EA" }}
            />
            {passError && <p className="text-xs mb-3" style={{ color: "#EF4444" }}>{passError}</p>}
            <button onClick={tryUnlock} className="w-full py-2.5 rounded-full text-sm font-semibold" style={{ background: "#22C55E", color: "#FFFFFF" }}>
              Entrar
            </button>
          </>
        ) : loading ? (
          <p className="text-sm" style={{ color: "#6E6E73" }}>Carregando...</p>
        ) : loadError ? (
          <p className="text-sm" style={{ color: "#EF4444" }}>{loadError}</p>
        ) : (
          <>
            <div className="flex items-center justify-between mb-4">
              <p className="text-xs" style={{ color: "#9A9AA0" }}>
                {totalAlunos} aluno(s) · {totalProfessores} professor(es) cadastrado(s)
              </p>
              <button onClick={carregarDados} className="text-xs px-2 py-1 rounded border" style={{ borderColor: "#E5E5EA", color: "#6E6E73" }}>
                Atualizar
              </button>
            </div>

            <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: "#22C55E" }}>
              Cliques por ferramenta
            </p>
            <div className="mb-5 space-y-1.5">
              {ferramentasOrdenadas.length === 0 && (
                <p className="text-sm italic" style={{ color: "#9A9AA0" }}>Nenhum clique registrado ainda.</p>
              )}
              {ferramentasOrdenadas.map(([nome, count]) => (
                <div key={nome} className="flex items-center justify-between text-sm" style={{ color: "#1D1D1F" }}>
                  <span>{nome}</span>
                  <span className="font-semibold px-2 py-0.5 rounded" style={{ background: "#F5F5F7" }}>{count}</span>
                </div>
              ))}
            </div>

            <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: "#22C55E" }}>
              Uso por aluno
            </p>
            <div className="space-y-3">
              {alunosOrdenados.length === 0 && (
                <p className="text-sm italic" style={{ color: "#9A9AA0" }}>Nenhum uso registrado ainda.</p>
              )}
              {alunosOrdenados.map(([nome, ferramentas]) => (
                <div key={nome} className="rounded-lg p-3" style={{ background: "#F5F5F7" }}>
                  <p className="text-sm font-medium mb-1" style={{ color: "#1D1D1F" }}>{nome}</p>
                  {Object.entries(ferramentas).map(([f, c]) => (
                    <p key={f} className="text-xs" style={{ color: "#6E6E73" }}>{f}: {c}x</p>
                  ))}
                </div>
              ))}
            </div>
          </>
        )}
        </div>
      </div>
    </div>
  );
}

  const [showInstall, setShowInstall] = useState(false);
  const [installTab, setInstallTab] = useState(
    /iPhone|iPad|iPod/.test(navigator.userAgent) ? "ios" : "android"
  );
  const [showAdmin, setShowAdmin] = useState(false);
  const [perfil, setPerfil] = useState(null);
  const tapCountRef = useRef(0);
  const tapTimerRef = useRef(null);

  useEffect(() => {
    if (!user) return;
    db.collection("usuarios").doc(user.uid).get()
      .then((doc) => setPerfil(doc.exists ? doc.data().perfil : null))
      .catch(() => {});
  }, [user]);

  function handleLogoTap() {
    tapCountRef.current += 1;
    if (tapTimerRef.current) clearTimeout(tapTimerRef.current);
    if (tapCountRef.current >= 5) {
      tapCountRef.current = 0;
      setShowAdmin(true);
    } else {
      tapTimerRef.current = setTimeout(() => { tapCountRef.current = 0; }, 2000);
    }
  }

  return (
    <div className="min-h-screen w-full" style={{ background: "#F5F5F7" }}>
      <div className="px-5 pb-6 flex items-center justify-center gap-3" style={{ paddingTop: "calc(env(safe-area-inset-top) + 2.5rem)" }}>
        <div onClick={handleLogoTap}>
          <CubeIcon size={56} />
        </div>
        <div className="text-left">
          <h1 className="text-4xl leading-none" style={{ color: "#1D1D1F", fontFamily: "'Poppins', sans-serif", fontWeight: 800 }}>
            Fisio<span style={{ color: "#22C55E" }}>Lab</span>
          </h1>
          <p className="text-sm mt-1" style={{ color: "#6E6E73" }}>
            by OrtoFlix — Ambiente de Estudo
          </p>
        </div>
      </div>

      {showAdmin && <AdminPanel onClose={() => setShowAdmin(false)} />}

      <div className="text-center -mt-3 mb-2 flex items-center justify-center gap-3">
        <button
          onClick={() => setShowAbout(true)}
          className="text-xs"
          style={{ color: "#9A9AA0" }}
        >
          Sobre
        </button>
        <span style={{ color: "#D2D2D7" }}>·</span>
        <button
          onClick={() => setShowInstall(true)}
          className="text-xs"
          style={{ color: "#9A9AA0" }}
        >
          Instalar app
        </button>
        <span style={{ color: "#D2D2D7" }}>·</span>
        <button
          onClick={() => auth.signOut()}
          className="text-xs"
          style={{ color: "#9A9AA0" }}
        >
          Sair da conta
        </button>
      </div>

      {showInstall && (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-5"
          style={{ background: "rgba(29,29,31,0.5)" }}
          onClick={() => setShowInstall(false)}
        >
          <div
            className="max-w-sm w-full rounded-2xl p-6"
            style={{ background: "#FFFFFF" }}
            onClick={(e) => e.stopPropagation()}
          >
            <h3 className="text-lg font-semibold mb-3" style={{ color: "#1D1D1F" }}>
              Instalar o FisioLab
            </h3>

            <div className="flex gap-2 mb-4">
              <button
                onClick={() => setInstallTab("ios")}
                className="flex-1 py-2 rounded-lg text-sm font-medium"
                style={installTab === "ios" ? { background: "#22C55E", color: "#FFFFFF" } : { background: "#F5F5F7", color: "#6E6E73", border: "1px solid #E5E5EA" }}
              >
                iPhone
              </button>
              <button
                onClick={() => setInstallTab("android")}
                className="flex-1 py-2 rounded-lg text-sm font-medium"
                style={installTab === "android" ? { background: "#22C55E", color: "#FFFFFF" } : { background: "#F5F5F7", color: "#6E6E73", border: "1px solid #E5E5EA" }}
              >
                Android
              </button>
            </div>

            {installTab === "ios" ? (
              <ol className="text-sm leading-relaxed space-y-2 mb-5" style={{ color: "#1D1D1F" }}>
                <li>1. Abra o FisioLab no <strong>Safari</strong>.</li>
                <li>2. Toque no ícone de compartilhar (o quadrado com a seta pra cima), na barra do navegador.</li>
                <li>3. Role para baixo e toque em <strong>"Adicionar à Tela de Início"</strong>.</li>
                <li>4. Toque em <strong>"Adicionar"</strong> no canto superior direito.</li>
              </ol>
            ) : (
              <ol className="text-sm leading-relaxed space-y-2 mb-5" style={{ color: "#1D1D1F" }}>
                <li>1. Abra o FisioLab no <strong>Chrome</strong>.</li>
                <li>2. Toque nos três pontinhos (⋮) no canto superior direito.</li>
                <li>3. Toque em <strong>"Adicionar à tela inicial"</strong> (ou "Instalar app").</li>
                <li>4. Confirme tocando em <strong>"Adicionar"</strong> ou <strong>"Instalar"</strong>.</li>
              </ol>
            )}

            <p className="text-xs mb-4" style={{ color: "#9A9AA0" }}>
              Depois disso, o ícone do FisioLab fica na sua tela inicial, igual a um aplicativo normal.
            </p>

            <button
              onClick={() => setShowInstall(false)}
              className="w-full text-center text-xs"
              style={{ color: "#9A9AA0" }}
            >
              Fechar
            </button>
          </div>
        </div>
      )}

      {showAbout && (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-5"
          style={{ background: "rgba(29,29,31,0.5)" }}
          onClick={() => setShowAbout(false)}
        >
          <div
            className="max-w-sm w-full rounded-2xl p-6"
            style={{ background: "#FFFFFF" }}
            onClick={(e) => e.stopPropagation()}
          >
            <p className="text-sm leading-relaxed mb-3" style={{ color: "#1D1D1F" }}>
              Olá! Eu sou o Prof. Felipe Cerqueira, fisioterapeuta, professor
              e diretor da OrtoFlix.
            </p>
            <p className="text-sm leading-relaxed mb-3" style={{ color: "#1D1D1F" }}>
              Criei o FisioLab para reunir ferramentas que ajudam no
              aprendizado da fisioterapia de forma prática e interativa. A
              ideia é oferecer recursos que eu gostaria que todos os meus
              alunos tivessem à disposição durante a graduação, mas que
              também podem ser úteis para professores e profissionais.
            </p>
            <p className="text-sm leading-relaxed mb-5" style={{ color: "#1D1D1F" }}>
              O FisioLab faz parte da OrtoFlix, uma plataforma que desenvolvi
              para compartilhar conhecimento em fisioterapia ortopédica. Se
              quiser conhecer um pouco mais sobre esse projeto, basta clicar
              abaixo.
            </p>
            <a
              href="https://ortoflix.com"
              target="_blank"
              rel="noopener noreferrer"
              className="block text-center text-sm font-semibold px-5 py-2.5 rounded-full mb-3"
              style={{ background: "#22C55E", color: "#FFFFFF" }}
            >
              Conhecer a OrtoFlix →
            </a>
            {perfil === "professor" && (
              <a
                href="manual-professor.pdf"
                target="_blank"
                rel="noopener noreferrer"
                className="block text-center text-sm font-medium px-5 py-2.5 rounded-full mb-3"
                style={{ background: "#F5F5F7", color: "#1D1D1F", border: "1px solid #E5E5EA" }}
              >
                📄 Manual do Professor
              </a>
            )}
            <button
              onClick={() => setShowAbout(false)}
              className="w-full text-center text-xs"
              style={{ color: "#9A9AA0" }}
            >
              Fechar
            </button>
          </div>
        </div>
      )}

      <div className="px-5 pb-6 max-w-2xl mx-auto">
        <p className="text-xs font-semibold uppercase tracking-wide mb-3" style={{ color: "#6E6E73" }}>
          Ferramentas
        </p>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          {ALL_TOOLS_SORTED.map((tool) =>
            tool.type === "external" ? (
              <ExternalToolCard key={tool.id} tool={tool} user={user} />
            ) : (
              <ToolCard key={tool.id} tool={tool} onSelect={onSelect} user={user} />
            )
          )}
        </div>

        <div className="mt-8 rounded-2xl p-6 text-center" style={{ background: "#1D1D1F" }}>
          <img
            src="ortoflix-logo.png"
            alt="OrtoFlix"
            style={{ maxWidth: "170px", width: "50%", height: "auto", margin: "0 auto 16px" }}
          />
          <p className="text-sm leading-relaxed mb-4" style={{ color: "#A1A1A6" }}>
            O maior streaming de fisioterapia ortopédica do Brasil. Conteúdo
            em série para estudantes e profissionais.
          </p>
          <a
            href="https://ortoflix.com"
            target="_blank"
            rel="noopener noreferrer"
            className="inline-block text-sm font-semibold px-5 py-2.5 rounded-full"
            style={{ background: "#22C55E", color: "#FFFFFF" }}
          >
            Acessar OrtoFlix →
          </a>
        </div>

        <ContactFooter />
      </div>
    </div>
  );
}

function App({ user }) {
  const [selected, setSelected] = useState(null);
  const tool = TOOLS.find((t) => t.id === selected);

  if (!selected || !tool) {
    return <Home onSelect={setSelected} user={user} />;
  }

  const ToolComponent = tool.component;
  return <ToolComponent onBack={() => setSelected(null)} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
